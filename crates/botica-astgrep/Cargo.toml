[package]
name = "botica-astgrep"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Base grammars (Bash, C, CSS, Go, HCL, HTML, Java, JavaScript, JSON, Lua, Python, Rust,
# TypeScript/TSX, YAML) come from the workspace dependency. The heavy or less common ones are opt-in.
[features]
all-languages = [
    "lang-cpp",
    "lang-csharp",
    "lang-dart",
    "lang-elixir",
    "lang-haskell",
    "lang-kotlin",
    "lang-markdown",
    "lang-nix",
    "lang-php",
    "lang-ruby",
    "lang-scala",
    "lang-solidity",
    "lang-swift",
]
lang-cpp = ["ast-grep-language/tree-sitter-cpp"]
lang-csharp = ["ast-grep-language/tree-sitter-c-sharp"]
lang-dart = ["ast-grep-language/tree-sitter-dart"]
lang-elixir = ["ast-grep-language/tree-sitter-elixir"]
lang-haskell = ["ast-grep-language/tree-sitter-haskell"]
lang-kotlin = ["ast-grep-language/tree-sitter-kotlin"]
lang-markdown = ["ast-grep-language/tree-sitter-md"]
lang-nix = ["ast-grep-language/tree-sitter-nix"]
lang-php = ["ast-grep-language/tree-sitter-php"]
lang-ruby = ["ast-grep-language/tree-sitter-ruby"]
lang-scala = ["ast-grep-language/tree-sitter-scala"]
lang-solidity = ["ast-grep-language/tree-sitter-solidity"]
lang-swift = ["ast-grep-language/tree-sitter-swift"]

[dependencies]
anyhow.workspace = true
ast-grep-core.workspace = true
ast-grep-config.workspace = true
ast-grep-language.workspace = true
globset.workspace = true
aho-corasick = "1"
memchr = "2"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
regex-syntax = "0.8"
serde.workspace = true
serde_yaml = "0.9"
tree-sitter = "=0.27.0"
serde_json.workspace = true
