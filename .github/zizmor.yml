# zizmor configuration.
# https://docs.zizmor.sh/configuration/
#
# The repo pins actions to version tags (e.g. @v7) and lets Dependabot keep
# them current, rather than pinning to commit hashes. Relax the unpinned-uses
# audit from its default blanket hash-pin policy to ref-pin so tag pins pass.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
