name: skills-drift

# Guard the upstream skills of the house baseline: the pinned [[skills]] step of catalog/recipes/base.toml.
#
# `npx skills add` skips unknown skill names without failing, so an upstream
# rename lands as a silently missing skill in every repo that installs the recipe base.
#
# On push/PR: assert the pinned tag still publishes every upstream skill of the recipe.
# On schedule: also compare against the newest upstream tag, so a rename or
# removal surfaces as a red run instead of at the next bump.
#
# No `paths:` filter: a filter stops firing when a file that it names moves.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so upstream renames surface without a code change here.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: skills-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: upstream skill catalog
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        # An exact tag: setup-uv publishes no major tag since v8.0.0.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      # --check-upstream also clones the newest tag, so keep it off the hot path
      # of ordinary PRs; the scheduled run is what watches upstream.
      - name: Validate the pinned catalog
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: uv run python scripts/check_skill_drift.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate the pin and compare against the newest upstream tag
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run python scripts/check_skill_drift.py --check-upstream | tee -a "$GITHUB_STEP_SUMMARY"
