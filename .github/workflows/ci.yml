name: CI

# Check the Rust workspace in lint/ that builds the `botica` binary, with all of its subcommands:
# format, clippy and tests. Add the checks of new subcommands here, not in a workflow of their own.
# Two switches turn tests that skip themselves into failures, so a runner that cannot
# exercise them does not pass silently:
#   BOTICA_REQUIRE_RUFF         the rule catalog is checked against `ruff linter`
#   BOTICA_REQUIRE_READ_ERRORS  unreadable files must really be unreadable (not run as root)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "lint/**"
      - "scripts/check_rule_change.py"
      - ".github/workflows/ci.yml"
  # Allow other workflows (e.g. a wheel release) to gate on this suite.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BOTICA_REQUIRE_RUFF: "1"
  BOTICA_REQUIRE_READ_ERRORS: "1"

jobs:
  test:
    name: fmt, clippy & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        # Pinned to an exact immutable tag, like the other workflows.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.12"
          enable-cache: false

      # `ruff linter` lists the rules the catalog is checked against. Pinned to the version the
      # suite was verified with; bump it on purpose, since a new ruff can add or rename rules.
      - name: Install ruff
        run: uv tool install ruff==0.16.3

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  # A change that adds a rule may only touch what that kind of rule needs (scripts/check_rule_change.py).
  # Anything else is a contract change: label the pull request `contract-change` to accept it.
  rule-contract:
    name: rule contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Check the contract of the rules the change adds
        env:
          BASE: origin/${{ github.base_ref }}
          ACKNOWLEDGED: ${{ contains(github.event.pull_request.labels.*.name, 'contract-change') }}
        run: |
          if [ "$ACKNOWLEDGED" = "true" ]; then set -- --acknowledged; else set --; fi
          uv run --locked python scripts/check_rule_change.py "$BASE" "$@"
