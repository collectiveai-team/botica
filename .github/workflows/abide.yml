name: abide

# The judgment rules of botica on the diff of a pull request. abide judges the diff with the rubric
# `.abide/rubric.json`, which `botica rules export --format abide` writes; botica keeps the verdicts
# that the configuration and the `ignore-file` comments keep, and a finding of severity warning or
# higher fails the job. The summary of the job has a table of the findings.
#
# TYPESAFE_AI_API_KEY is a secret of the repository and TYPESAFE_AI_BASE_URL a variable
# (https://api.typesafe.ai/v1, or the address of a server with the same API). A pull request from a
# fork gets no secret, and the job fails. A pull request of Dependabot gets no secret of Actions
# either, and the job is skipped.
#
# The copy of `catalog/recipes/files/github/workflows/abide.yml` that the recipe `base` installs,
# with the botica built from this checkout instead of `uvx botica@X.Y.Z`.

on:
  pull_request:

concurrency:
  group: abide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abide:
    name: judgment rules
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
      TYPESAFE_AI_BASE_URL: ${{ vars.TYPESAFE_AI_BASE_URL }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BOTICA: target/debug/botica
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build botica
        run: cargo build --locked -p botica-cli

      - name: Check the rubric
        run: |
          "$BOTICA" rules export --format abide --check

      - name: Judge the diff
        run: |
          mkdir -p "$RUNNER_TEMP/abide"
          if [ -z "$TYPESAFE_AI_API_KEY" ]; then
            echo "::error::the secret TYPESAFE_AI_API_KEY is not set"
            exit 2
          fi
          # Deleted files have nothing left to judge.
          git diff --diff-filter=d "$BASE_SHA"...HEAD > "$RUNNER_TEMP/abide/pr.diff"
          # The probability of a verdict changes from one run to the next, and abide can fail on a
          # timeout. A first run with no finding decides; otherwise abide judges the diff twice more
          # and botica keeps a finding only when a majority of the runs give it.
          runs=()
          for attempt in 1 2 3; do
            status=0
            npx --yes @coldtea/abide@0.0.11 check --json --diff "$RUNNER_TEMP/abide/pr.diff" \
              > "$RUNNER_TEMP/abide/run-$attempt.json" || status=$?
            # abide exits with 1 when a verdict is in the band act; botica decides.
            if [ "$status" -gt 1 ]; then
              echo "::notice::run $attempt of abide failed (exit $status)"
              continue
            fi
            runs+=(--judged "$RUNNER_TEMP/abide/run-$attempt.json")
            if [ "$attempt" -eq 1 ] && "$BOTICA" lint "${runs[@]}" \
              --fail-on warning > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "::notice::run 1 of abide has a finding: abide judges the diff twice more"
            fi
          done
          if [ "${#runs[@]}" -eq 0 ]; then
            exit "$status"
          fi
          printf '%s\n' "${runs[@]}" > "$RUNNER_TEMP/abide/runs"

      - name: Table of the findings
        run: |
          {
            echo "## Judgment rules"
            echo
            mapfile -t runs < "$RUNNER_TEMP/abide/runs"
            "$BOTICA" lint "${runs[@]}" --output-format markdown --exit-zero
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on the findings
        run: |
          mapfile -t runs < "$RUNNER_TEMP/abide/runs"
          "$BOTICA" lint "${runs[@]}" --output-format github --fail-on warning
