name: Site

# A pull request only builds the site, so a broken link or a rule page that does not render fails
# before the merge. Publishing needs GitHub Pages set to publish from GitHub Actions
# (Settings -> Pages -> Source).
# `feat/botica-lint` publishes the site until it is merged into `main`.

on:
  push:
    branches: [main, feat/botica-lint]
    paths:
      - "website/**"
      - "catalog/rules/**"
      - "catalog/references/**"
      - "standards/**"
      - "crates/botica-catalog/**"
      - "crates/botica-cli/src/rules_export.rs"
      - "scripts/build_site.sh"
      - "scripts/site_*.py"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - "catalog/rules/**"
      - "catalog/references/**"
      - "standards/**"
      - "crates/botica-catalog/**"
      - "crates/botica-cli/src/rules_export.rs"
      - "scripts/build_site.sh"
      - "scripts/site_*.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        # An exact tag: setup-uv publishes no major tag since v8.0.0.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build the site
        run: scripts/build_site.sh

      - name: Upload the site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/botica-lint'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/botica-lint'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
