name: Site

# Build the standards site with scripts/build_site.sh and publish it to GitHub Pages from `main`.
# Any other branch, and a pull request, only builds it, so a broken link or a rule page that does
# not render is caught before the merge. GitHub Pages must be set to publish from GitHub Actions
# (Settings -> Pages -> Source). Until `feat/botica-lint` is merged it publishes too: when it is
# merged, remove the branch from the three places that name it here and from the branch policies
# of the `github-pages` environment (Settings -> Environments), and replace it with `main` in the
# two addresses of "edit this page" (`edit_uri` and `catalog_uri` of website/zensical.toml).

on:
  push:
    branches: [main, feat/botica-lint]
    paths:
      - "website/**"
      - "catalog/rules/**"
      - "catalog/references/**"
      - "standards/**"
      - "crates/botica-catalog/**"
      - "crates/botica-cli/src/rules_export.rs"
      - "scripts/build_site.sh"
      - "scripts/site_*.py"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - "catalog/rules/**"
      - "catalog/references/**"
      - "standards/**"
      - "crates/botica-catalog/**"
      - "crates/botica-cli/src/rules_export.rs"
      - "scripts/build_site.sh"
      - "scripts/site_*.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        # Pinned to an exact immutable tag, like the other workflows.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build the site
        run: scripts/build_site.sh

      - name: Upload the site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/botica-lint'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/botica-lint'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
