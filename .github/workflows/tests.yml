name: Tests

# Runs the same prek hooks as locally (ruff-format, ruff, pyrefly, hygiene)
# plus the pytest suite, all through uv so versions match uv.lock.

on:
  push:
    branches: [main]
  pull_request:
  # Allow other workflows (e.g. botica-release.yml) to gate on this suite.
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint, type-check & test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        # An exact tag: setup-uv publishes no major tag since v8.0.0.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: true

      # Uses the version pinned by .python-version / pyproject.toml.
      - name: Set up Python
        run: uv python install

      # --frozen fails if uv.lock is out of date. Add --extra / --group flags
      # here if the test suite needs optional dependencies.
      - name: Install dependencies
        run: uv sync --frozen

      # The hooks of botica run `cargo run -p botica-cli` (ADR 0013).
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Lint, format & type check (prek)
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run pytest
