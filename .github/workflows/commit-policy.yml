name: commit-policy

# CES-91 on every commit of the pull request or of the push, which `git commit --no-verify` does
# not skip.
#
# The copy of `catalog/recipes/files/github/workflows/commit-policy.yml` that the recipe `ci`
# installs, with the botica built from this checkout instead of `uvx botica@X.Y.Z`.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: commit-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-ai-coauthorship:
    name: no-ai-coauthorship
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build botica
        run: cargo build --locked -p botica-cli

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push that creates the branch has no commit before it: its range is the whole history.
          range="$BASE_SHA..$HEAD_SHA"
          if [ -z "${BASE_SHA//0/}" ]; then
            range="$HEAD_SHA"
          fi
          target/debug/botica lint --select no-ai-coauthorship --commits "$range"
