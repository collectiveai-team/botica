name: Botica release

# Tag-driven: `git tag vX.Y.Z && git push origin vX.Y.Z`, with X.Y.Z equal to the version in
# lint/Cargo.toml ([workspace.package]) and Cargo.lock in sync. v0.1.0 to v0.6.0 are scaffolding's
# releases: botica starts at 0.7.0. The release does not take "latest" while main still publishes
# scaffolding releases (the publish job puts the old one back). The file name is the one the PyPI trusted publisher is registered with.
# Gated on the CI suite and on the repository's own Tests suite. Builds wheels with the binary and `botica.sdk`
# (maturin, bindings = "bin") per platform, attaches them with a .sha256 each to a GitHub Release,
# and uploads them to PyPI (trusted publishing) when PUBLISH_TO_PYPI is "true".

on:
  push:
    tags:
      - "v*.*.*"

# One run per tag, and never cancelled halfway: a release that stops after `publish` is a mess.
concurrency:
  group: botica-release-${{ github.ref }}
  cancel-in-progress: false

# No top-level permissions: grant least privilege per job instead.
jobs:
  test:
    name: botica tests
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  repo-tests:
    name: repository tests
    permissions:
      contents: read
    uses: $/.github/workflows/tests.yml

  version:
    name: tag matches Cargo.toml
    needs: [test, repo-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the tag with the workspace version
        run: |
          expected="${TAG#v}"
          found="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' lint/Cargo.toml)"
          if [ "$found" != "$expected" ]; then
            echo "tag $TAG names $expected but lint/Cargo.toml has ${found:-no version}" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Check that the history seals every status of the catalog
        run: uv run --no-project --python 3.14 --with cyclopts python scripts/stamp_release.py check

  draft:
    name: draft release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the draft
        run: gh release create "$TAG" --draft --latest=false --generate-notes --title "$TAG"

  wheels:
    name: wheel ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64-apple-darwin, manylinux: "off" }
          - { os: macos-latest, target: x86_64-apple-darwin, manylinux: "off" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "off" }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: lint
          args: --release --locked --out dist

      - name: Attach the wheel and its checksum to the release
        shell: bash
        working-directory: lint/dist
        # On Linux maturin builds in a container as root, so dist/ is not writable here: the
        # checksums go to a directory of their own.
        run: |
          mkdir -p ../sums
          for wheel in *.whl; do
            (sha256sum "$wheel" 2>/dev/null || shasum -a 256 "$wheel") > "../sums/$wheel.sha256"
          done
          gh release upload "$TAG" ./*.whl ../sums/*.sha256

  publish:
    name: publish release
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # Publishing a draft makes it "latest" whatever `--latest=false` said when it was created, and
      # `--latest=false` on an edit does nothing: GitHub picks the newest release again. So the one
      # that was latest is read first and marked latest again afterwards.
      - name: Publish the draft and keep the latest release as it was
        run: |
          previous="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          gh release edit "$TAG" --draft=false
          if [ -n "$previous" ] && [ "$previous" != "$TAG" ]; then
            gh release edit "$previous" --latest
          fi

  # Off until the repository variable PUBLISH_TO_PYPI is "true" (see docs/botica-release.md): PyPI
  # needs a project and a trusted publisher that are set up outside this repo, and a published
  # version cannot be replaced. Uploads the wheels of the release, with no token (OIDC).
  pypi:
    name: publish to PyPI
    needs: publish
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the wheels of the release
        run: gh release download "$TAG" --pattern '*.whl' --dir dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
