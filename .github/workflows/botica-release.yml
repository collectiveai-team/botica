name: Botica release

# Tag-driven: `git tag -a vX.Y.Z && git push origin HEAD vX.Y.Z`, with X.Y.Z equal to the version in
# Cargo.toml ([workspace.package]) and Cargo.lock in sync. v0.1.0 to v0.6.0 are releases of
# the removed scaffolding package: botica starts at 0.7.0. The file name is the one the PyPI trusted publisher is registered with.
# Gated on the CI suite and on the repository's own Tests suite. Builds wheels with the binary and `botica.sdk`
# (maturin, bindings = "bin") per platform, attaches them with a .sha256 each to a GitHub Release,
# and uploads them to PyPI (trusted publishing) when PUBLISH_TO_PYPI is "true". Then it pushes the
# mirror botica-pre-commit with its tag, and points the hooks of the branch of the release at it.

on:
  push:
    tags:
      - "v*.*.*"

# One run per tag, and never cancelled halfway: a release that stops after `publish` is a mess.
concurrency:
  group: botica-release-${{ github.ref }}
  cancel-in-progress: false

# No top-level permissions: grant least privilege per job instead.
jobs:
  test:
    name: botica tests
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  repo-tests:
    name: repository tests
    permissions:
      contents: read
    uses: $/.github/workflows/tests.yml

  version:
    name: tag matches Cargo.toml
    needs: [test, repo-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the tag with the workspace version
        run: |
          expected="${TAG#v}"
          found="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)"
          if [ "$found" != "$expected" ]; then
            echo "tag $TAG names $expected but Cargo.toml has ${found:-no version}" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Check that the history seals every status of the catalog
        run: uv run --no-project --python 3.14 --with cyclopts python scripts/stamp_release.py check

  draft:
    name: draft release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the draft
        run: gh release create "$TAG" --draft --latest=false --generate-notes --title "$TAG"

  wheels:
    name: wheel ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64-apple-darwin, manylinux: "off" }
          - { os: macos-latest, target: x86_64-apple-darwin, manylinux: "off" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "off" }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist

      - name: Attach the wheel and its checksum to the release
        shell: bash
        working-directory: dist
        # On Linux maturin builds in a container as root, so dist/ is not writable here: the
        # checksums go to a directory of their own.
        run: |
          mkdir -p ../sums
          for wheel in *.whl; do
            (sha256sum "$wheel" 2>/dev/null || shasum -a 256 "$wheel") > "../sums/$wheel.sha256"
          done
          gh release upload "$TAG" ./*.whl ../sums/*.sha256

  publish:
    name: publish release
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # Publishing the draft makes it "latest".
      - name: Publish the draft
        run: gh release edit "$TAG" --draft=false

  # Off until the repository variable PUBLISH_TO_PYPI is "true" (see docs/botica-release.md): PyPI
  # needs a project and a trusted publisher that are set up outside this repo, and a published
  # version cannot be replaced. Uploads the wheels of the release, with no token (OIDC).
  pypi:
    name: publish to PyPI
    needs: publish
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the wheels of the release
        run: gh release download "$TAG" --pattern '*.whl' --dir dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/

  # The mirror `collectiveai-team/botica-pre-commit` is what prek installs: a copy of
  # distribution/botica-pre-commit/ at the version of the release, with a lightweight tag (prek
  # does not install an annotated tag of the mirror). The tag must come after the wheel is on PyPI.
  # MIRROR_DEPLOY_KEY is the private half of a deploy key of the mirror with write access. A run
  # whose tag is already on the mirror changes nothing, so a failed release can be run again.
  mirror:
    name: update the mirror
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Wait for the wheel on PyPI
        run: |
          for _ in $(seq 60); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/botica/${TAG#v}/json" && exit 0
            sleep 10
          done
          echo "botica ${TAG#v} is not on PyPI after 10 minutes" >&2
          exit 1

      - name: Point the mirror's package at the release
        run: uv run --no-project --python 3.14 --with cyclopts python scripts/bump_mirror_rev.py "${TAG#v}"

      - name: Commit, tag and push the mirror
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/mirror_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$key"
          hosts="$RUNNER_TEMP/known_hosts"
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts"
          url="git@github.com:collectiveai-team/botica-pre-commit.git"
          if git ls-remote --exit-code --tags "$url" "refs/tags/$TAG" >/dev/null; then
            echo "the mirror already has $TAG"
            exit 0
          fi
          git clone --quiet "$url" "$RUNNER_TEMP/mirror"
          cp -a distribution/botica-pre-commit/. "$RUNNER_TEMP/mirror/"
          cp LICENSE "$RUNNER_TEMP/mirror/"
          cd "$RUNNER_TEMP/mirror"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit --quiet -m "chore: release ${TAG#v}"
          git tag "$TAG"
          git push --quiet origin HEAD "refs/tags/$TAG"

  # After the mirror has the tag, the branch of the release points its own `prek.toml`, the
  # template of the recipes and the docs at it (scripts/bump_mirror_rev.py), and the commit goes
  # straight to that branch. The hook of botica at the new `rev` and the tests of the repository run
  # first: when one fails, nothing is pushed and the release ends red. The branch is `main` when the tag is on it, or else the one
  # branch that holds the tag.
  bump:
    name: point the hooks at the release
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the branch of the release
        run: |
          branches="$(git branch -r --contains "$TAG" --format='%(refname:lstrip=3)' | grep -v '^HEAD$' || true)"
          if printf '%s\n' "$branches" | grep -qx main; then
            branch=main
          elif [ "$(printf '%s\n' "$branches" | grep -c .)" = 1 ]; then
            branch="$branches"
          else
            echo "no single branch holds $TAG: ${branches:-none}" >&2
            exit 1
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Point the hooks at the release
        run: |
          git switch --quiet "$BRANCH"
          uv run --no-project --python 3.14 --with cyclopts python scripts/bump_mirror_rev.py "${TAG#v}"

      - name: Run the hook of botica at the new rev
        run: uvx prek run botica --all-files

      # tests/test_engineering_rules_pins.py compares the `rev` the skills teach with prek.toml.
      - name: Run the tests of the repository
        run: uv sync --frozen && uv run pytest

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the hooks already point at $TAG"
            exit 0
          fi
          git commit --quiet -m "chore(release): the hooks of botica point at $TAG"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for _ in 1 2 3; do
            git push --quiet "$remote" "HEAD:$BRANCH" && exit 0
            git pull --quiet --rebase "$remote" "$BRANCH"
          done
          echo "could not push to $BRANCH" >&2
          exit 1
