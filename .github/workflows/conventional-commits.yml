name: Conventional Commits

# CES-75, on the title of the pull request, which a squash merge takes as the subject. The title is
# read from an env var (never interpolated into the shell) to avoid script injection.
#
# The copy of `catalog/recipes/files/github/workflows/conventional-commits.yml` that the recipe
# `ci` installs, with the botica built from this checkout instead of `uvx botica@X.Y.Z`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventional-commits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate PR title
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build botica
        run: cargo build --locked -p botica-cli

      - name: Validate Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: target/debug/botica lint --select conventional-commits --pr-title="$PR_TITLE"
