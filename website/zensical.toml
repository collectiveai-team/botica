[project]
site_name = "Botica"
site_description = "The rules of botica, one page each."
site_url = "https://collectiveai-team.github.io/botica/"
repo_url = "https://github.com/collectiveai-team/botica"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/filter.js"]

# Where "edit this page" opens: a page of `docs_dir` at `edit_uri`, a rule page at `catalog_uri`,
# because it is written in the README of its rule, which the export names in `readme`, relative to
# the catalog (`partials/actions.html` joins them).
edit_uri = "edit/main/website/docs/"

[project.extra.edit]
catalog_uri = "edit/main/catalog/rules/"

# The `status` of a rule page is the status of the rule; the sidebar shows what each one means.
[project.extra.status]
stable = "Stable"
preview = "Preview: runs only with preview = true"
removed = "Removed: kept for history"

# The ids of the Discussions of this repository, as any giscus snippet carries them: they are public.
# The category of a rule page is the one named like its family; `fallback` takes the pages whose
# family has none. `partials/comments.html` reads them.
[project.extra.giscus]
repo = "collectiveai-team/botica"
repo_id = "R_kgDOS6BBdw" # betterleaks:allow
fallback = { name = "General", id = "DIC_kwDOS6BBd84DIcYi" } # betterleaks:allow

[project.extra.giscus.categories]
architecture = "DIC_kwDOS6BBd84DIcbn" # betterleaks:allow
botica = "DIC_kwDOS6BBd84DIcb_" # betterleaks:allow
cli = "DIC_kwDOS6BBd84DJFlY" # betterleaks:allow
config = "DIC_kwDOS6BBd84DJFlf" # betterleaks:allow
data-models = "DIC_kwDOS6BBd84DIcbo" # betterleaks:allow
database = "DIC_kwDOS6BBd84DJFlg" # betterleaks:allow
# No Discussions category is named `docs` yet: its pages go to `Ideas` until one exists.
docs = "DIC_kwDOS6BBd84DIcYk" # betterleaks:allow
fastapi = "DIC_kwDOS6BBd84DIcbv" # betterleaks:allow
# No Discussions category is named `infrastructure` yet: its pages go to `Show and tell` until one
# exists.
infrastructure = "DIC_kwDOS6BBd84DIcYl" # betterleaks:allow
logging = "DIC_kwDOS6BBd84DIcb2" # betterleaks:allow
process = "DIC_kwDOS6BBd84DIcb9" # betterleaks:allow
security = "DIC_kwDOS6BBd84DJLLx" # betterleaks:allow
standards = "DIC_kwDOS6BBd84DIeEU" # betterleaks:allow
structure = "DIC_kwDOS6BBd84DIcb-" # betterleaks:allow
testing = "DIC_kwDOS6BBd84DJLgK" # betterleaks:allow
tooling = "DIC_kwDOS6BBd84DJLL-" # betterleaks:allow
writing = "DIC_kwDOS6BBd84DJFlh" # betterleaks:allow

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logo-dark.svg"
favicon = "assets/favicon.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
