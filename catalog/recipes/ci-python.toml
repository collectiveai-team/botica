description = "GitHub Actions for a Python project: tests, dependabot and osv-scanner"
extends = ["ci"]

[[files]]
path = ".github/workflows/tests.yml"
template = "files/github/workflows/tests.yml"

[[files]]
path = ".github/dependabot.yml"
template = "files/github/dependabot.yml"

[[files]]
path = ".github/workflows/osv-scanner.yml"
template = "files/github/workflows/osv-scanner.yml"

[params.cooldown-days]
description = "The days that a new release of a dependency waits before a package manager or dependabot takes it"
kind = "days"
default = 7

[params.prek-version]
description = "The version of prek that the workflows run with uvx (empty: the newest)"
kind = "version"
default = ""
