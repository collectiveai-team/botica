description = "A Python project: the rules of any repository and the ones about Python code, pyproject.toml, the Python hooks of prek and the dev tools"
extends = ["base"]
rules = [
  "no-tests-in-package",
  "no-dict-alias",
  "no-dict-call-return",
  "no-dict-literal-return",
  "no-dict-return-annotation",
  "api-schemas-extra-forbid",
  "log-get-logger",
  "log-no-print",
  "settings-module",
  "cli-typed-framework",
  "database-package",
  "import-layers",
  "settings-env-schema",
  "cognitive-complexity",
  "ruff-selection",
  "docstring-matches-signature",
  "pytest-strict",
  "test-no-subprocess",
  "test-no-network",
  "uv-cooldown",
  "ruff-heavy-imports-in-function",
  "ruff-imports-at-top",
  "no-eager-heavy-imports",
]

[[files]]
path = "pyproject.toml"
template = "files/pyproject-base.toml"

[[sections]]
path = "prek.toml"
marker = "# MARK: validate-pyproject"
template = "sections/prek-validate-pyproject.toml"

[[sections]]
path = "prek.toml"
marker = "# MARK: ruff-format"
template = "sections/prek-ruff.toml"

[[sections]]
path = "prek.toml"
marker = "# MARK: pyrefly"
template = "sections/prek-python-tools.toml"

[[sections]]
path = "pyproject.toml"
marker = "# MARK: uv"
template = "sections/pyproject-uv.toml"

[[sections]]
path = "pyproject.toml"
marker = "# MARK: Ruff"
template = "sections/pyproject-ruff.toml"

[[sections]]
path = "pyproject.toml"
marker = "# MARK: Pyrefly"
template = "sections/pyproject-pyrefly.toml"

[[sections]]
path = "pyproject.toml"
marker = "# MARK: Pytest"
template = "sections/pyproject-pytest.toml"

[[tools]]
manager = "uv"
packages = [
  "ruff",
  "pyrefly",
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "pytest-randomly",
  "pytest-socket",
]

[params.ruff-import-rule]
description = "The rule of ruff for heavy imports: TID253 when requires-python allows a version before 3.15, PLC0415 from 3.15"
choices = ["TID253", "PLC0415"]
default = "TID253"

[params.ruff-adapters]
description = "The glob of the adapters, which import a heavy library at the top before Python 3.15"
default = "**/impl/**"

[params.pyrefly-version]
description = "The version of pyrefly that the hook of prek runs with uvx (empty: the newest)"
kind = "version"
default = ""

[params.deptry-version]
description = "The version of deptry that the hook of prek runs with uvx (empty: the newest)"
kind = "version"
default = ""
[params.cooldown-days]
description = "The days that a new release of a dependency waits before a package manager or dependabot takes it"
default = 7
kind = "days"
