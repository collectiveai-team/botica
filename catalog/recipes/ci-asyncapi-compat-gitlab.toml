description = "GitLab CI: asyncapi diff fails a merge request that breaks the AsyncAPI document of an app, unless the merge request has the label breaking-change"

[[files]]
path = ".gitlab-ci.yml"
template = "files/gitlab/gitlab-ci.yml"

[[files]]
path = ".gitlab/ci/asyncapi-compat.yml"
template = "files/gitlab/ci/asyncapi-compat.yml"

[[files]]
path = ".gitlab/asyncapi-diff-overrides.json"
template = "files/gitlab/asyncapi-diff-overrides.json"

[params.asyncapi-cli-version]
description = "The version of @asyncapi/cli that asyncapi-compat.yml runs with npx (empty: the newest)"
kind = "version"
default = "6.2.3"
