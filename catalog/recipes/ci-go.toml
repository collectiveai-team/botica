description = "GitHub Actions for a Go module: gofmt, build, vet and test, dependabot and osv-scanner"
extends = ["ci"]
rules = ["dependabot-cooldown"]

[[files]]
path = ".github/workflows/go.yml"
template = "files/github-go/workflows/go.yml"

[[files]]
path = ".github/dependabot.yml"
template = "files/github-go/dependabot.yml"

[[files]]
path = ".github/workflows/osv-scanner.yml"
template = "files/github-go/workflows/osv-scanner.yml"

[params.cooldown-days]
description = "The days that a new release of a dependency waits before a package manager or dependabot takes it"
kind = "days"
default = 7
