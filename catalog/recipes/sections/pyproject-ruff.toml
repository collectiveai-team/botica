# MARK: Ruff
[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# DOC102, DOC202 and DOC403 are preview rules. `explicit-preview-rules` keeps every other preview
# rule off, and `preview` stays in `lint` so that the formatter keeps its stable style.
preview = true
explicit-preview-rules = true
select = [
  "E",
  "F",
  "I",
  "C4",
  "C90",
  "ICN",
  "INP",
  "PIE",
  "PT",
  "TC",
  "PGH",
  "NPY",
  "PLE",
  "PLW",
  "FA",
  "B",
  "S",
  "G",
  "SIM",
  "RET",
  "DTZ",
  "PTH",
  "LOG",
  "TID251",
  "TID252",
  # TID253 before Python 3.15, PLC0415 from 3.15: the parameter ruff-import-rule.
  "{{ param.ruff-import-rule }}",
  "UP",
  "RUF",
  "ERA001",
  "ASYNC",
  "A",
  "BLE",
  "SLOT",
  "PLR0124",
  "PLR0133",
  "D200",
  "D205",
  "D212",
  "D300",
  "D301",
  "D400",
  "D401",
  "D403",
  "D405",
  "D406",
  "D407",
  "D408",
  "D409",
  "D410",
  "D411",
  "D412",
  "D413",
  "D414",
  "D415",
  "D417",
  "D418",
  "D419",
  "DOC102",
  "DOC202",
  "DOC403",
  "PERF",
]
task-tags = ["TODO", "FIXME", "XXX", "MARK"]
# `botica lint` suppressions in `# noqa: BTxxx` comments; without this ruff reports RUF102.
external = ["BT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
banned-module-level-imports = ["torch", "tensorflow", "jax", "transformers", "cv2"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]
# The adapters, which exist to use a heavy library, and the test files import it at the top.
"{{ param.ruff-adapters }}" = ["TID253"]
"**/test_*.py" = ["TID253"]
"**/*_test.py" = ["TID253"]
