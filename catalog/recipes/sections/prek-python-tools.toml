# MARK: pyrefly
[[repos]]
repo = "local"

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uvx pyrefly check --config pyproject.toml"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: deptry
# CES-109.
[[repos.hooks]]
id = "deptry"
name = "deptry (unused/missing/misplaced dependencies)"
entry = "uvx deptry ."
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: complexipy
# CES-110.
[[repos.hooks]]
id = "complexipy"
name = "complexipy (cognitive complexity)"
entry = "uvx complexipy --max-complexity-allowed 15"
language = "system"
types = ["python"]
priority = 2
