# MARK: pyrefly
[[repos]]
repo = "local"

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uvx pyrefly{{ param.pyrefly-version.at }} check --config pyproject.toml"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: deptry
# CES-109.
[[repos.hooks]]
id = "deptry"
name = "deptry (unused/missing/misplaced dependencies)"
entry = "uvx deptry{{ param.deptry-version.at }} ."
language = "system"
types = ["python"]
pass_filenames = false
priority = 2
