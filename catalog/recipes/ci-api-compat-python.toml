description = "GitHub Actions: griffe fails a pull request that breaks the public API of a Python package that others import, unless the pull request has the label breaking-change"

[[files]]
path = ".github/workflows/api-compat-python.yml"
template = "files/github/workflows/api-compat-python.yml"

[params.griffe-version]
description = "The version of griffe that api-compat-python.yml runs with uvx (empty: the newest)"
kind = "version"
default = "2.3.2"
