name: mutants-go

# The mutants of the code that a pull request changes, with gremlins: `--diff` tests only the
# mutants inside the changes against the base of the pull request. botica reads no report of
# gremlins, so the job uploads its JSON report as the artifact `gremlins-mutants`, and the log lists
# each mutant that LIVED.
#
# The job never blocks: `continue-on-error` keeps a failure of gremlins from failing the run, and
# `timeout-minutes` caps the time. gremlins sets no threshold of efficacy, so a mutant that lived
# does not fail it either.

on:
  pull_request:

concurrency:
  group: mutants-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutants:
    name: mutants of the change
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          # gremlins compares with the base branch, which the history holds.
          fetch-depth: 0
          persist-credentials: false

      # The Go version is the one of go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v{{ param.gremlins-version }}

      - name: Test the mutants of the change
        run: gremlins unleash --diff "origin/$BASE_REF" --output gremlins.json --output-statuses lct

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gremlins-mutants
          path: gremlins.json
          if-no-files-found: ignore
          retention-days: 90
