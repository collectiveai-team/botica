name: Docker

# Builds the runtime image and pushes it to GHCR:
#   - push to main  -> :latest and :sha-<short>
#   - tag vX.Y.Z    -> :X.Y.Z and :latest
# The image name defaults to ghcr.io/<owner>/<repo>; adjust IMAGE below if you
# publish under a different name. Add a build matrix if you
# need several flavours, such as cpu and gpu.
#
# In a public repository the job signs a build provenance attestation for the
# digest it pushed (actions/attest, Sigstore), which anyone can check with
#   gh attestation verify oci://<image>@<digest> --owner <owner>
# GitHub attests artifacts in a private repository only on Enterprise Cloud, so
# a private repository skips the step and keeps the unsigned provenance that
# BuildKit adds to the image.

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # the Sigstore certificate of the attestation
      attestations: write # store the attestation
      artifact-metadata: write # the storage record of the attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs tags to resolve the version
          persist-credentials: false

      # GHCR takes only lowercase names, and the owner or the repository can have capitals.
      - name: Lowercase the image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
