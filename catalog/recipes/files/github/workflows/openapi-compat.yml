name: openapi-compat

# CES-131: a pull request that breaks the HTTP contract of the service carries the label
# `breaking-change`.
#
# The OpenAPI document is generated by the app and not committed. The job exports it at the head
# and at the base of the pull request, from the same environment, and oasdiff fails on the changes
# that break a client: a removed path or operation, a removed required response property, a new
# required request parameter.
#
# With the label `breaking-change` on the pull request, a failure is reported as a warning and the
# job passes. Adding or removing the label runs the check again. A repository creates the label
# once: `gh label create breaking-change --description "Breaks a published interface"`.
#
# Replace `replace_me.entrypoints.api:app` in APP with the module and the name of the FastAPI app.
# The export imports the app, so the dependencies the import needs come from `uv sync`; a project
# whose full install is heavy declares a dependency group with only the web layer and syncs it with
# `uv sync --locked --only-group <group>`. The job fails while APP starts with `replace_me`, and
# passes without comparing when the base has no such module. The two documents go to `.tmp/`, which the recipe `base` ignores, so the checkout of
# the base keeps them.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: openapi-compat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP: replace_me.entrypoints.api:app
  # The import reads the code of the checkout, not an installed copy, so the base is read after
  # its checkout.
  PYTHONPATH: src:.
  LABEL: breaking-change

jobs:
  oasdiff:
    name: HTTP contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for the app at the base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$APP" == replace_me.* ]]; then
            echo "::error::Replace replace_me in APP with the module of the FastAPI app."
            exit 1
          fi
          module="${APP%%:*}"
          present=false
          for dir in ${PYTHONPATH//:/ }; do
            for path in "$dir/${module//.//}.py" "$dir/${module//.//}/__init__.py"; do
              if git cat-file -e "$BASE_SHA:${path#./}" 2>/dev/null; then
                present=true
              fi
            done
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [[ "$present" == false ]]; then
            echo "::notice::The base has no module $module; nothing to compare."
          fi

      - name: Install uv
        if: steps.base.outputs.present == 'true'
        # An exact tag: setup-uv publishes no major tag since v8.0.0.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false

      - name: Install dependencies
        if: steps.base.outputs.present == 'true'
        run: uv sync --locked

      - name: Export the head and the base
        if: steps.base.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPORT: |
            import importlib, json, os, sys
            module, _, name = os.environ["APP"].partition(":")
            app = getattr(importlib.import_module(module), name)
            with open(sys.argv[1], "w", encoding="utf-8") as out:
                json.dump(app.openapi(), out, indent=2)
        run: |
          set -euo pipefail
          mkdir -p .tmp/head .tmp/base
          uv run --no-sync python -c "$EXPORT" .tmp/head/openapi.json
          git checkout --quiet --detach "$BASE_SHA"
          uv run --no-sync python -c "$EXPORT" .tmp/base/openapi.json
          git checkout --quiet --detach "$HEAD_SHA"

      - name: Compare the contract with the base
        id: compare
        if: steps.base.outputs.present == 'true'
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, env.LABEL) }}
        uses: oasdiff/oasdiff-action/breaking@v0.1.20
        with:
          # Paths in the workspace: the container of the action sees the workspace and not
          # RUNNER_TEMP.
          base: .tmp/base/openapi.json
          revision: .tmp/head/openapi.json
          fail-on: ERR
          # The default uploads both documents to oasdiff.com and comments the link on the pull
          # request; the check needs neither.
          review: false
          github-token: ""

      - name: Report a breaking change
        if: always() && steps.compare.outcome == 'failure'
        env:
          DECLARED: ${{ contains(github.event.pull_request.labels.*.name, env.LABEL) }}
        run: |
          if [[ "$DECLARED" == true ]]; then
            echo "::warning::The OpenAPI document breaks, and the label $LABEL declares it."
          else
            echo "::error::The OpenAPI document breaks. If the break is on purpose, add the label $LABEL to the pull request."
          fi
