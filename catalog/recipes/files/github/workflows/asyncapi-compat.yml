name: asyncapi-compat

# CES-131: a pull request that breaks the events of the service carries the label
# `breaking-change`.
#
# The AsyncAPI document is generated by the app and not committed. The job exports it at the head
# and at the base of the pull request, from the same environment, and `asyncapi diff` fails on the
# changes that break a consumer: a removed channel or operation, a changed channel address, and,
# with the overrides of `.github/asyncapi-diff-overrides.json`, a removed or retyped property of a
# message and a property that stops being required. Without the overrides, `asyncapi diff` reports
# the changes inside a payload as unclassified and passes them.
#
# With the label `breaking-change` on the pull request, a failure is reported as a warning and the
# job passes. Adding or removing the label runs the check again. A repository creates the label
# once: `gh label create breaking-change --description "Breaks a published interface"`.
#
# Replace `replace_me.entrypoints.asyncapi:document` in ASYNCAPI with the module and the name of a
# function that takes no argument and returns the document: a dict, a JSON string, or an object
# with `to_json()`. The job fails while ASYNCAPI starts with `replace_me`, and passes without
# comparing when the base has no such module.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: asyncapi-compat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASYNCAPI: replace_me.entrypoints.asyncapi:document
  # The import reads the code of the checkout, not an installed copy, so the base is read after
  # its checkout.
  PYTHONPATH: src:.
  LABEL: breaking-change

jobs:
  asyncapi-diff:
    name: event contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for the module at the base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$ASYNCAPI" == replace_me.* ]]; then
            echo "::error::Replace replace_me in ASYNCAPI with the module of the AsyncAPI document."
            exit 1
          fi
          module="${ASYNCAPI%%:*}"
          present=false
          for dir in ${PYTHONPATH//:/ }; do
            for path in "$dir/${module//.//}.py" "$dir/${module//.//}/__init__.py"; do
              if git cat-file -e "$BASE_SHA:${path#./}" 2>/dev/null; then
                present=true
              fi
            done
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [[ "$present" == false ]]; then
            echo "::notice::The base has no module $module; nothing to compare."
          fi

      - name: Install uv
        if: steps.base.outputs.present == 'true'
        # An exact tag: setup-uv publishes no major tag since v8.0.0.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false

      - name: Install dependencies
        if: steps.base.outputs.present == 'true'
        run: uv sync --frozen

      - name: Export the head and the base
        if: steps.base.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPORT: |
            import importlib, json, os, sys
            module, _, name = os.environ["ASYNCAPI"].partition(":")
            document = getattr(importlib.import_module(module), name)()
            if hasattr(document, "to_json"):
                document = document.to_json()
            if isinstance(document, str):
                document = json.loads(document)
            with open(sys.argv[1], "w", encoding="utf-8") as out:
                json.dump(document, out, indent=2)
        run: |
          set -euo pipefail
          mkdir -p .tmp/head .tmp/base
          cp .github/asyncapi-diff-overrides.json .tmp/
          uv run --no-sync python -c "$EXPORT" .tmp/head/asyncapi.json
          git checkout --quiet --detach "$BASE_SHA"
          uv run --no-sync python -c "$EXPORT" .tmp/base/asyncapi.json
          git checkout --quiet --detach "$HEAD_SHA"

      - uses: actions/setup-node@v7
        if: steps.base.outputs.present == 'true'
        with:
          # @asyncapi/cli 6 needs Node 24.
          node-version: "24"

      - name: Compare the contract with the base
        id: compare
        if: steps.base.outputs.present == 'true'
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, env.LABEL) }}
        run: >-
          npx --yes @asyncapi/cli{{ param.asyncapi-cli-version.at }} diff
          .tmp/base/asyncapi.json .tmp/head/asyncapi.json
          --type breaking
          --overrides .tmp/asyncapi-diff-overrides.json

      - name: Report a breaking change
        if: always() && steps.compare.outcome == 'failure'
        env:
          DECLARED: ${{ contains(github.event.pull_request.labels.*.name, env.LABEL) }}
        run: |
          if [[ "$DECLARED" == true ]]; then
            echo "::warning::The AsyncAPI document breaks, and the label $LABEL declares it."
          else
            echo "::error::The AsyncAPI document breaks. If the break is on purpose, add the label $LABEL to the pull request."
          fi
