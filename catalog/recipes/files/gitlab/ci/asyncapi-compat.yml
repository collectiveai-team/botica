# CES-131: a merge request that breaks the events of the service carries the label breaking-change.
#
# The AsyncAPI document is generated by the app and not committed. The job exports it at the head
# and at the base of the merge request, from the same environment, and `asyncapi diff` fails on the
# changes that break a consumer: a removed channel or operation, a changed channel address, and,
# with the overrides of .gitlab/asyncapi-diff-overrides.json, a removed or retyped property of a
# message and a property that stops being required. Without the overrides, `asyncapi diff` reports
# the changes inside a payload as unclassified and passes them.
#
# With the label breaking-change on the merge request, a failure is reported as a warning and the
# job passes. Create the label once, by hand: Issues > Labels > New label, breaking-change.
#
# Replace `replace_me.entrypoints.asyncapi:document` in ASYNCAPI with the module and the name of a
# function that takes no argument and returns the document: a dict, a JSON string, or an object
# with to_json(). The job fails while ASYNCAPI starts with replace_me, and passes without comparing
# when the base has no such module.
asyncapi-compat:
  stage: test
  image: node:24-bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    ASYNCAPI: replace_me.entrypoints.asyncapi:document
    PYTHONPATH: "src:."
    LABEL: breaking-change
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends curl ca-certificates git python3 >/dev/null
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      set -eu
      case "$ASYNCAPI" in
        replace_me.*)
          echo "Replace replace_me in ASYNCAPI with the module of the AsyncAPI document." >&2
          exit 1
          ;;
      esac
      BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      HEAD_SHA="$CI_MERGE_REQUEST_SOURCE_BRANCH_SHA"
      module="${ASYNCAPI%%:*}"
      module_path=$(echo "$module" | tr . /)
      present=false
      for dir in $(echo "$PYTHONPATH" | tr : ' '); do
        for path in "$dir/$module_path.py" "$dir/$module_path/__init__.py"; do
          if git cat-file -e "$BASE_SHA:${path#./}" 2>/dev/null; then
            present=true
          fi
        done
      done
      if [ "$present" = false ]; then
        echo "The base has no module $module; nothing to compare."
        exit 0
      fi
      uv python install
      uv sync --locked
      mkdir -p .tmp/head .tmp/base
      cp .gitlab/asyncapi-diff-overrides.json .tmp/
      cat > /tmp/export_asyncapi.py <<'PYEOF'
      import importlib, json, os, sys
      module, _, name = os.environ["ASYNCAPI"].partition(":")
      document = getattr(importlib.import_module(module), name)()
      if hasattr(document, "to_json"):
          document = document.to_json()
      if isinstance(document, str):
          document = json.loads(document)
      with open(sys.argv[1], "w", encoding="utf-8") as out:
          json.dump(document, out, indent=2)
      PYEOF
      uv run --no-sync python /tmp/export_asyncapi.py .tmp/head/asyncapi.json
      git checkout --quiet --detach "$BASE_SHA"
      uv run --no-sync python /tmp/export_asyncapi.py .tmp/base/asyncapi.json
      git checkout --quiet --detach "$HEAD_SHA"
      declared=false
      case ",$CI_MERGE_REQUEST_LABELS," in *",$LABEL,"*) declared=true ;; esac
      if npx --yes @asyncapi/cli{{ param.asyncapi-cli-version.at }} diff .tmp/base/asyncapi.json .tmp/head/asyncapi.json --type breaking --overrides .tmp/asyncapi-diff-overrides.json; then
        exit 0
      fi
      if [ "$declared" = true ]; then
        echo "The AsyncAPI document breaks, and the label $LABEL declares it."
        exit 0
      fi
      echo "The AsyncAPI document breaks. If the break is on purpose, add the label $LABEL to the merge request." >&2
      exit 1
