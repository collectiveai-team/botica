# CES-131: a merge request that breaks the HTTP contract of the service carries the label
# breaking-change.
#
# The OpenAPI document is generated by the app and not committed. The job exports it at the head
# and at the base of the merge request, from the same environment, and oasdiff fails on the changes
# that break a client: a removed path or operation, a removed required response property, a new
# required request parameter.
#
# With the label breaking-change on the merge request, a failure is reported as a warning and the
# job passes. Create the label once, by hand: Issues > Labels > New label, breaking-change.
#
# Replace `replace_me.entrypoints.api:app` in APP with the module and the name of the FastAPI app.
# The export imports the app, so the dependencies the import needs come from `uv sync`; a project
# whose full install is heavy declares a dependency group with only the web layer and syncs it with
# `uv sync --locked --only-group <group>`. The job fails while APP starts with replace_me, and
# passes without comparing when the base has no such module.
#
# oasdiff has no versioned release pinned here: `go install .../oasdiff@latest` always takes the
# newest tag. Pin a version once the project settles on one (`@v1.x.y`), as the other jobs do.
openapi-compat:
  stage: test
  image: python:3.13-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    APP: replace_me.entrypoints.api:app
    PYTHONPATH: "src:."
    LABEL: breaking-change
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends curl ca-certificates git golang-go >/dev/null
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH:$(go env GOPATH)/bin"
    - go install github.com/oasdiff/oasdiff@latest
  script:
    - |
      set -eu
      case "$APP" in
        replace_me.*)
          echo "Replace replace_me in APP with the module of the FastAPI app." >&2
          exit 1
          ;;
      esac
      BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      HEAD_SHA="$CI_MERGE_REQUEST_SOURCE_BRANCH_SHA"
      module="${APP%%:*}"
      module_path=$(echo "$module" | tr . /)
      present=false
      for dir in $(echo "$PYTHONPATH" | tr : ' '); do
        for path in "$dir/$module_path.py" "$dir/$module_path/__init__.py"; do
          if git cat-file -e "$BASE_SHA:${path#./}" 2>/dev/null; then
            present=true
          fi
        done
      done
      if [ "$present" = false ]; then
        echo "The base has no module $module; nothing to compare."
        exit 0
      fi
      uv sync --locked
      mkdir -p .tmp/head .tmp/base
      cat > /tmp/export_openapi.py <<'PYEOF'
      import importlib, json, os, sys
      module, _, name = os.environ["APP"].partition(":")
      app = getattr(importlib.import_module(module), name)
      with open(sys.argv[1], "w", encoding="utf-8") as out:
          json.dump(app.openapi(), out, indent=2)
      PYEOF
      uv run --no-sync python /tmp/export_openapi.py .tmp/head/openapi.json
      git checkout --quiet --detach "$BASE_SHA"
      uv run --no-sync python /tmp/export_openapi.py .tmp/base/openapi.json
      git checkout --quiet --detach "$HEAD_SHA"
      declared=false
      case ",$CI_MERGE_REQUEST_LABELS," in *",$LABEL,"*) declared=true ;; esac
      if oasdiff breaking .tmp/base/openapi.json .tmp/head/openapi.json --fail-on ERR; then
        exit 0
      fi
      if [ "$declared" = true ]; then
        echo "The OpenAPI document breaks, and the label $LABEL declares it."
        exit 0
      fi
      echo "The OpenAPI document breaks. If the break is on purpose, add the label $LABEL to the merge request." >&2
      exit 1
