# MARK: uv-lock
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.3"
hooks = [{ id = "uv-lock", priority = 0 }]

# MARK: pre-commit-hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

# MARK: check-merge-conflict
[[repos.hooks]]
id = "check-merge-conflict"
priority = 0

# MARK: check-added-large-files
[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=750"]
exclude = "^uv\\.lock$"
priority = 0

# MARK: check-toml
[[repos.hooks]]
id = "check-toml"
priority = 0

# MARK: check-yaml
[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]
priority = 0

# MARK: end-of-file-fixer
[[repos.hooks]]
id = "end-of-file-fixer"
priority = 0

# MARK: trailing-whitespace
[[repos.hooks]]
id = "trailing-whitespace"
priority = 0

# MARK: betterleaks
# Secret scanner (gitleaks fork). language = "golang" so prek builds it from the
# pinned tag in an isolated toolchain. Scans staged changes on commit; --redact
# keeps any matched secret out of the output.
[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.9.0"
hooks = [{ id = "betterleaks", priority = 0 }]

# MARK: agents-conventional-commits
# CES-75. Merge, revert and fixup subjects are exempt.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "agents-conventional-commits"
name = "agents-conventional-commits (commit-msg)"
entry = "python -c \"import re,sys; msg=open(sys.argv[1],encoding='utf-8').readline().strip(); ok=bool(re.match(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9._-]+\\))?!?: .+', msg)) or msg.startswith(('Merge ','Revert ','fixup! ')); sys.exit(0 if ok else not print(f'Error: commit subject must follow Conventional Commits (type(scope): description). Got: {msg!r}'))\""
language = "system"
stages = ["commit-msg"]

# MARK: no-ai-coauthorship
# CES-91. `--no-verify` skips this hook; `commit-policy.yml` checks the commits again in CI.
[[repos.hooks]]
id = "no-ai-coauthorship"
name = "no-ai-coauthorship (commit-msg)"
entry = "python -c \"import re,sys; msg=open(sys.argv[1],encoding='utf-8').read(); tools='claude|anthropic|copilot|github copilot|chatgpt|openai|codex|cursor|windsurf|aider|gemini|devin|opencode'; pat=re.compile(r'(?im)^\\s*(co-authored-by:.*(' + tools + r')|generated[\\s-]+(with|by):?.*(' + tools + r')|ai-generated-by:?.*(' + tools + r')|assisted-by:?.*(' + tools + r'))'); m=pat.search(msg); sys.exit(0 if not m else not print(f'Error: commit message must not carry AI co-authorship/attribution trailers. Found: {m.group(0)!r}'))\""
language = "system"
stages = ["commit-msg"]

# MARK: jscpd
# CES-118. `--threshold` is the gate; do not add `--exit-code`, which fails on any clone.
# Lockfiles are tracked, so they are ignored by name.
# Set --threshold just above the duplicated-lines percentage of `npx --yes jscpd@5 .` in the repo.
[[repos.hooks]]
id = "jscpd"
name = "jscpd (copy-paste duplication)"
entry = "npx --yes jscpd@5 . --threshold 1 --ignore \"**/uv.lock,**/poetry.lock,**/Pipfile.lock,**/package-lock.json,**/pnpm-lock.yaml,**/yarn.lock,**/bun.lock,**/bun.lockb,**/Cargo.lock,**/go.sum,**/composer.lock,**/Gemfile.lock\""
language = "system"
pass_filenames = false
priority = 2

# MARK: botica
# The hooks read the selection from `botica.toml` or `[tool.botica]`, as the editor does. The mirror
# installs botica from PyPI at the release `rev` names.
[[repos]]
repo = "https://github.com/collectiveai-team/botica-pre-commit"
rev = "v0.13.0"

# The rules that look at one file, run on the files of the commit.
[[repos.hooks]]
id = "botica"
priority = 2

# The rules that read the whole project (import-layers, settings-env-schema, external-config), run
# once per commit with no file names.
[[repos.hooks]]
id = "botica-project"
priority = 2

# The block of AGENTS.md and the rubric of abide, against the catalog and the configuration. After a
# change to the selection, or a new file, run `botica rules export --format agents-md --output
# AGENTS.md` and `botica rules export --format abide`.
[[repos.hooks]]
id = "botica-agents-md"
priority = 2

[[repos.hooks]]
id = "botica-rubric"
priority = 2

# MARK: hadolint-docker
# CES-114; runs only when a Dockerfile exists.
[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.15.1"
hooks = [{ id = "hadolint-docker", files = "^Dockerfile", priority = 2 }]
