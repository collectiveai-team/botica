# MARK: uv-lock
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.3"
hooks = [{ id = "uv-lock", priority = 0 }]

# MARK: pre-commit-hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

# MARK: check-merge-conflict
[[repos.hooks]]
id = "check-merge-conflict"
priority = 0

# MARK: check-added-large-files
[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=750"]
exclude = "^uv\\.lock$"
priority = 0

# MARK: check-toml
[[repos.hooks]]
id = "check-toml"
priority = 0

# MARK: check-yaml
[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]
priority = 0

# MARK: end-of-file-fixer
[[repos.hooks]]
id = "end-of-file-fixer"
priority = 0

# MARK: trailing-whitespace
[[repos.hooks]]
id = "trailing-whitespace"
priority = 0

# MARK: betterleaks
# Secret scanner (gitleaks fork). language = "golang" so prek builds it from the
# pinned tag in an isolated toolchain. Scans staged changes on commit; --redact
# keeps any matched secret out of the output.
[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.9.0"
hooks = [{ id = "betterleaks", priority = 0 }]

# MARK: agents-conventional-commits
# CES-75. Merge, revert and fixup subjects are exempt.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "agents-conventional-commits"
name = "agents-conventional-commits (commit-msg)"
entry = "uvx botica@{{ param.botica-version }} lint --select conventional-commits --commit-msg"
language = "system"
stages = ["commit-msg"]

# MARK: no-ai-coauthorship
# CES-91. `--no-verify` skips this hook; `commit-policy.yml` checks the commits again in CI.
[[repos.hooks]]
id = "no-ai-coauthorship"
name = "no-ai-coauthorship (commit-msg)"
entry = "uvx botica@{{ param.botica-version }} lint --select no-ai-coauthorship --commit-msg"
language = "system"
stages = ["commit-msg"]

# MARK: jscpd
# CES-118. `--threshold` is the gate; do not add `--exit-code`, which fails on any clone.
# Lockfiles are tracked, so they are ignored by name.
# Set --threshold just above the duplicated-lines percentage of `npx --yes jscpd{{ param.jscpd-version.at }} .` in the repo.
[[repos.hooks]]
id = "jscpd"
name = "jscpd (copy-paste duplication)"
entry = "npx --yes jscpd{{ param.jscpd-version.at }} . --threshold 1 --ignore \"**/uv.lock,**/poetry.lock,**/Pipfile.lock,**/package-lock.json,**/pnpm-lock.yaml,**/yarn.lock,**/bun.lock,**/bun.lockb,**/Cargo.lock,**/go.sum,**/composer.lock,**/Gemfile.lock\""
language = "system"
pass_filenames = false
priority = 2

# MARK: botica
# The hooks read the selection from `botica.toml` or `[tool.botica]`, as the editor does. The mirror
# installs botica from PyPI at the release `rev` names.
[[repos]]
repo = "https://github.com/collectiveai-team/botica-pre-commit"
rev = "v{{ param.botica-version }}"

# The rules that look at one file, run on the files of the commit.
[[repos.hooks]]
id = "botica"
priority = 2

# The rules that read the whole project (import-layers, settings-env-schema, external-config), run
# once per commit with no file names.
[[repos.hooks]]
id = "botica-project"
priority = 2

# The block of AGENTS.md and the rubric of abide, against the catalog and the configuration. After a
# change to the selection, or a new file, run `botica rules export --format agents-md --output
# AGENTS.md` and `botica rules export --format abide`.
[[repos.hooks]]
id = "botica-agents-md"
priority = 2

[[repos.hooks]]
id = "botica-rubric"
priority = 2

# MARK: hadolint
# CES-114. Lints every file that prek tags `dockerfile`, in any folder, and does nothing in a repo
# without one. The mirror installs the release binary of hadolint that `rev` names, with no Docker.
# DL3008 is ignored because Debian and Ubuntu drop old package versions from their archives:
# https://github.com/hadolint/hadolint/issues/884
[[repos]]
repo = "https://github.com/AleksaC/hadolint-py"
rev = "v2.15.1"
hooks = [{ id = "hadolint", args = ["--failure-threshold=warning", "--ignore=DL3008"], priority = 2 }]

# MARK: docker-compose-config
# CES-114. Checks each Compose file against the schema of Compose, with no daemon. It runs only on
# files named compose*.y*ml or docker-compose*.y*ml, so a repo without one needs no Docker. The two
# flags keep a missing .env and unset variables from failing it. `docker compose config` takes
# service names as arguments, so the entry passes each file with `--file`.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "docker-compose-config"
name = "docker compose config"
entry = "sh -c 'status=0; for file do docker compose --file \"$file\" config --quiet --no-interpolate --no-env-resolution || status=1; done; exit $status' --"
language = "system"
files = '(^|/)(docker-)?compose[^/]*\.ya?ml$'
types = ["yaml"]
priority = 2
