# gofmt, build, vet and test on every push to main and every merge request.
#
# No branch filter: a repository that lands work as stacks has merge requests whose target is
# another feature branch, and a gate that only runs against main leaves every intermediate merge
# request of a stack unverified.
go:
  stage: test
  image: golang:1-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  script:
    # gofmt runs first and prints the diff, not just the file list: a bare list tells a contributor
    # a file is wrong without telling them what to change.
    - |
      unformatted="$(gofmt -l .)"
      if [ -n "$unformatted" ]; then
        echo "not gofmt-clean:"
        echo "$unformatted"
        echo
        gofmt -d .
        exit 1
      fi
    - go build ./...
    - go vet ./...
    # -race costs time on a large suite; it is the only automated guard over concurrent code. Drop
    # it if the module has none.
    - go test ./... -count=1 -race
