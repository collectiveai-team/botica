description = "GitHub Actions for a Node project that uses pnpm: dependabot and osv-scanner"
extends = ["ci"]
rules = ["dependabot-cooldown"]

[[files]]
path = ".github/dependabot.yml"
template = "files/github-node/dependabot.yml"

[[files]]
path = ".github/workflows/osv-scanner.yml"
template = "files/github-node/workflows/osv-scanner.yml"

[params.cooldown-days]
description = "The days that a new release of a dependency waits before a package manager or dependabot takes it"
kind = "days"
default = 7
