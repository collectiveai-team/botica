id = "plain-writing"
code = "BTWRIT001"
standard = "CES-120"
summary = "Text has none of the signs of model writing"
status = "preview"
tags = ["writing"]
files = ["**/*.md", "**/*.rst", "**/*.txt"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["*"]
when = "edit"
why-not-deterministic = "A word list finds the vocabulary, but whether a clause judges, hedges or makes a claim with no source needs a reading of the sentence."

[implementations.question]
type = "boolean"
instructions = "Read the prose of the file. Does it carry a sign of model writing: inflated significance, a trailing clause that judges, words that avoid is and has, definition by negation, a sentence that strings three items for rhythm, hedges and vague attribution, bold for emphasis, text addressed to the reader, or a claim with no source? Commands, code, lists of names and a bulleted list of cases are not prose."
criteria = { true = "the prose carries one or more of the signs", false = "the prose is plain and carries none of the signs" }
