id = "minimal-comments"
code = "BTWRIT002"
standard = "CES-120"
summary = "A comment says only what the code cannot"
status = "preview"
tags = ["writing"]
files = ["**/*.py", "**/*.pyi", "**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "**/*.go", "**/*.rs", "**/*.toml", "**/*.yml", "**/*.yaml"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["*"]
when = "edit"
why-not-deterministic = "Whether a comment repeats the code or explains a choice the code cannot show depends on what the code says, which needs a reading of both."
act-at = 0.85

[implementations.question]
type = "boolean"
instructions = "Read the comments of the file and the code next to them. Leave out first the comments that never break the rule: a comment whose text starts with `MARK:`, which botica and editors read as the start of a section; a header that describes the whole file; a doc comment or docstring of any item; the code of a standard cited alone; a directive that a tool reads (a suppression, `zizmor: ignore`, `noqa`); and an option of a template left commented out under a comment that says how to turn it on. Of the comments left, does one repeat what the next lines say, name a section of the file, keep code commented out or tell the history of a change? A comment that gives the reason for a choice that looks wrong, an invariant the types do not show or a workaround with the link to its cause does not break the rule, however many such comments the file has. Attributes such as `#[test]` are not comments. A file with no comment left does not break the rule."
criteria = { true = "a comment repeats the code, names a section, keeps old code or tells the history of a change", false = "every comment says something the code cannot, or the file has none" }
