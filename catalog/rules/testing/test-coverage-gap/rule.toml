id = "test-coverage-gap"
code = "BTTEST003"
standard = "CES-66"
summary = "A coverage gap is closed with a test that asserts a behaviour"
status = "preview"
tags = ["tests", "coverage"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["*"]
when = "pull-request"
why-not-deterministic = "A test with no `assert` is visible, but whether a test asserts the behaviour of the code it runs, through a helper, a fixture or a check of what it raises, needs the code of the test and of what it calls."

[implementations.question]
type = "boolean"
instructions = "Read the title, the description and the diff of the pull request. Does it add or change a test that runs code without asserting a behaviour: no assertion, or only that no exception was raised or that the result is not `None`? A new module of the public interface, such as a route, a command or the public module of a package, that no test of the change or of the repository exercises is a coverage gap too. A test that asserts on what the code returns, raises, writes or sends, and a change that neither touches tests nor adds such a module, do not break the rule."
criteria = { true = "the change adds a test that runs code without asserting a behaviour, or a module of the public interface that no test exercises", false = "every test the change adds asserts a behaviour and a test exercises every module of the interface it adds, or the change neither touches tests nor adds such a module" }
