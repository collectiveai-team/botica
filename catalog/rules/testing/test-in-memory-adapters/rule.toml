id = "test-in-memory-adapters"
code = "BTTEST001"
standard = "CES-64"
references = ["in-memory-adapters"]
summary = "Tests drive the logic through in-memory adapters, not mocks"
status = "preview"
tags = ["tests"]
files = ["**/tests/**/*.py", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["python"]
when = "edit"
why-not-deterministic = "An import of `unittest.mock` is visible, but whether the mocked object is a port of the project that has an in-memory adapter or a third-party boundary that cannot be faked needs the design of the project."

[implementations.question]
type = "boolean"
instructions = "Read the tests of the file. Does a test replace a port of the project with a mock, or assert on the calls that a mock received, where a working in-memory adapter of the port would drive the logic? A mock of a third-party boundary that cannot reasonably be faked does not break the rule."
criteria = { true = "the tests mock a port of the project, or assert on the calls a mock received", false = "the tests use in-memory adapters of the ports and assert on outcomes" }
