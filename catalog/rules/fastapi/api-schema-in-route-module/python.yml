id: api-schema-in-route-module
language: python
severity: warning
message: "CES-17 (api-schema-in-route-module): A Pydantic schema is defined in a route module. Move it to the schemas/requests or schemas/responses package of api."
files:
  - "**/api/**/routers/**/*.py"
  - "**/api/**/routes/**/*.py"
rule:
  kind: class_definition
  has:
    field: superclasses
    stopBy: end
    regex: "BaseModel"
