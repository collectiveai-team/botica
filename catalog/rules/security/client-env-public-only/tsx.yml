id: client-env-public-only
language: tsx
severity: error
message: "A Client Component reads a private environment variable, which the server renders into the HTML that every visitor gets and the browser reads as empty: read it in a Server Component or in a module that imports `server-only` and pass the value as a prop, or rename it with the prefix `NEXT_PUBLIC_` if it is public."
rule:
  kind: member_expression
  regex: "^process\\.env\\.[A-Za-z_][A-Za-z0-9_]*$"
  not:
    regex: "^process\\.env\\.(NEXT_PUBLIC_|NODE_ENV$)"
  inside:
    kind: program
    stopBy: end
    has:
      kind: expression_statement
      nthChild:
        position: 1
        ofRule:
          not:
            kind: comment
      regex: "^[\"']use client[\"']"
