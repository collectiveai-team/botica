id = "no-pass-through"
code = "BTARCH005"
standard = "CES-0"
summary = "A unit does something its callers would otherwise repeat"
status = "preview"
tags = ["design"]
files = ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js"]
ignores = ["**/tests/**", "**/test_*.py", "**/*.test.*", "**/*.spec.*"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["python", "typescript", "javascript"]
when = "edit"
why-not-deterministic = "A function that calls one other function is common and often right; whether it adds a validation, a mapping, a default or a decision, or only forwards, needs a reading of both."

[implementations.question]
type = "boolean"
instructions = "Read each class and function that the file defines. Answer true only when one of them only forwards its calls to another object (the same arguments, the same result, no validation, mapping, retry, default, logging or decision) and its callers could call that object directly. A port, an adapter that translates a library to a port of the project, and a function that orders the steps of a use case do not break the rule."
criteria = { true = "a unit only forwards its calls", false = "every unit adds something its callers would otherwise repeat" }
