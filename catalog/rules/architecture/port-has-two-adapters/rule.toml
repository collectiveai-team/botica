id = "port-has-two-adapters"
code = "BTARCH004"
standard = "CES-0"
summary = "A port has a second adapter, or it is not a port"
status = "preview"
tags = ["design"]
files = ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js"]
ignores = ["**/tests/**", "**/test_*.py", "**/*.test.*", "**/*.spec.*"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["python", "typescript", "javascript"]
when = "edit"
why-not-deterministic = "Counting the classes that implement an interface is mechanical, but whether the dependency behind it is pure computation or I/O, and whether a class of the tests is a working adapter, needs a reading of the code."

[implementations.question]
type = "boolean"
instructions = "Read each port that the file defines: a Protocol, an ABC or an interface that callers depend on instead of a concrete class. Answer true only when a port has a single adapter in the project, no in-memory adapter in the tests, and the dependency behind it is pure computation or in-memory state. A port over a database, a network service, a third-party API, the clock or the filesystem does not break this rule: its missing fake is a finding of test-in-memory-adapters."
criteria = { true = "a port has one adapter and nothing varies across it", false = "each port has a second adapter, or stands for an external dependency" }
