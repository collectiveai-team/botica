id = "separate-orchestration"
code = "BTARCH002"
standard = "CES-8"
summary = "A function either orders the steps or does one of them"
status = "preview"
tags = ["design"]
files = ["**/*.py", "**/*.ts", "**/*.tsx", "**/*.js"]
ignores = ["**/tests/**", "**/test_*.py", "**/*.test.*", "**/*.spec.*"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["python", "typescript", "javascript"]
when = "edit"
why-not-deterministic = "Nesting depth and length are measured elsewhere; whether a branch is a decision of the flow or a rule of the domain, and whether a call is I/O or logic, needs a reading of the code."

[implementations.question]
type = "boolean"
instructions = "Read each function of the file. Does each one either order the steps of a task (calls, control flow) or carry out one step (a calculation, a rule of the domain, an I/O call), without one function deciding the flow, computing the domain rules and doing the I/O all at once?"
criteria = { true = "orchestration and the steps it calls live in separate functions", false = "a function mixes the order of the steps with the logic and the I/O of those steps" }
