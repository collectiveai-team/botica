id = "no-eager-heavy-imports"
code = "BTARCH004"
standard = "CES-0"
summary = "A heavy library is imported where it is used, not when the module loads"
status = "preview"
tags = ["imports", "startup"]
ignores = ["**/impl/**", "**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py", "**/*.pyi"]
scope = "file"
needs = "syntax"
run-on = ["cli", "save"]
default-enabled = false
default-severity = "warning"

[options]
modules = { type = "strings", default = ["torch", "tensorflow", "jax", "transformers", "cv2"] }

[[implementations]]
kind = "native"
languages = ["python"]
