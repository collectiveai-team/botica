id = "version-pin"
code = "BTCONF005"
standard = "CES-77"
summary = "A change keeps the requires-python of the project unless it names the move"
status = "preview"
tags = ["python", "review"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["*"]
when = "pull-request"
why-not-deterministic = "A diff shows that `requires-python` changed; whether the change is a move that the project agreed, with its reason, or a rewrite to the house default needs the description of the change."

[implementations.question]
type = "boolean"
instructions = "Read the title, the description and the diff of the pull request. If it changes `requires-python` in a `pyproject.toml` that already had one, does the description name the move and give its reason, such as a dependency that now supports the new version?"
criteria = { true = "the pin is kept, is new, or moves with its reason named", false = "an existing pin changes with no reason named, as a rewrite to the default" }
