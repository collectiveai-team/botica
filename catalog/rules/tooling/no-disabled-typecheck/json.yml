id: no-disabled-typecheck
language: json
severity: error
message: "This turns off a strict check of TypeScript for the whole project: remove the option set to `false` so that `\"strict\": true` covers it, and fix the type errors it reports."
files:
  - "**/tsconfig.json"
  - "**/tsconfig.*.json"
  - "**/jsconfig.json"
rule:
  kind: pair
  all:
    - has:
        field: key
        regex: "^\"(strict|noImplicitAny|noImplicitThis|strictNullChecks|strictFunctionTypes|strictBindCallApply|strictPropertyInitialization|strictBuiltinIteratorReturn|useUnknownInCatchVariables|alwaysStrict)\"$"
    - has:
        field: value
        kind: "false"
