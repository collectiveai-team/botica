id: cli-typed-framework
language: python
severity: warning
message: "Build command lines with a typed, declarative framework (Typer or Cyclopts) and Rich, instead of argparse, click or sys.argv handled by hand. Reading sys.argv[0] or handing sys.argv to the framework is fine."
rule:
  any:
    - pattern: import argparse
    - pattern: import argparse as $X
    - pattern: from argparse import $$$X
    - pattern: import click
    - pattern: import click as $X
    - pattern: from click import $$$X
    - pattern: sys.argv
      not:
        inside:
          stopBy: end
          any:
            - pattern: sys.argv[0]
            - pattern: $F(sys.argv)
            - pattern: $F(sys.argv[1:])
