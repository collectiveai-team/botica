id = "pr-small-by-intent"
code = "BTPROC001"
standard = "CES-122"
summary = "A pull request carries one intent"
status = "preview"
tags = ["review"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["*"]
when = "pull-request"
why-not-deterministic = "A count of tickets, commits, files or lines does not say how many intents a change has: several vertical slices can implement one delivery, and a ten-line change can fix a bug and reformat an unrelated module."

[implementations.question]
type = "boolean"
instructions = "Read the title, the description, the available spec and the diff of the pull request. Does it carry unrelated intents: a reformatting sweep, a refactor that the intent does not need or an unrelated fix? Several tickets, commits or vertical slices may implement one delivery intent. Neither their count nor the word \"and\" alone means the intents are unrelated."
criteria = { true = "the change mixes unrelated intents, even if one ticket tracks them: a reformatting sweep, an unnecessary refactor or an unrelated fix sits next to the stated intent", false = "each part serves one delivery intent, including required refactors, tests, documentation and several tickets or vertical slices" }
