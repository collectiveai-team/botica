id = "respect-local-repo"
code = "BTPROC002"
standard = "CES-30"
summary = "A change keeps the deliberate choices of the repository"
status = "preview"
tags = ["review"]
default-enabled = false
default-severity = "warning"

[[implementations]]
kind = "judgment"
languages = ["*"]
when = "pull-request"
why-not-deterministic = "A diff shows that a pin or a setting changed; whether the old value was a deliberate choice of the repository, and whether the description agrees a migration, needs a reading of the change and its history."

[implementations.question]
type = "boolean"
instructions = "Read the title, the description and the diff of the pull request. Does it overwrite an existing, deliberate choice of the repository (a version pin, the configuration of a lint or a tool, a dependency, the layout) to match a default, with no migration that the description names and explains?"
criteria = { true = "an existing choice is overwritten to match a default, with no migration named", false = "existing choices are kept, or changed as a named migration" }
