id: asyncio-no-get-event-loop
language: python
severity: warning
message: "Since Python 3.14, asyncio.get_event_loop() raises RuntimeError when no event loop is set instead of creating one, and asyncio.set_event_loop() only sets the loop that call returns. Start the loop with asyncio.run() or asyncio.Runner at the entry point, and get it with asyncio.get_running_loop() inside a coroutine or a callback."
rule:
  kind: call
  any:
    - has:
        field: function
        kind: attribute
        all:
          - has:
              field: object
              regex: "^asyncio$"
          - has:
              field: attribute
              regex: "^(get|set)_event_loop$"
    - all:
        - has:
            field: function
            kind: identifier
            regex: "^(get|set)_event_loop$"
            pattern: $NAME
        - inside:
            kind: module
            stopBy: end
            has:
              kind: import_from_statement
              all:
                - has:
                    field: module_name
                    regex: "^asyncio$"
                - has:
                    kind: dotted_name
                    has:
                      kind: identifier
                      pattern: $NAME
