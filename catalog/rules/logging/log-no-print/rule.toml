id = "log-no-print"
code = "BTLOG002"
standard = "CES-46"
references = ["structured-logging"]
summary = "Libraries log, they don't print"
status = "stable"
replaces = "no-console-log"
tags = ["logging"]
scope = "file"
needs = "syntax"
run-on = ["cli", "save", "type"]
default-enabled = true
default-severity = "warning"

