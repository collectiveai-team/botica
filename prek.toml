# MARK: uv-lock
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.3"
hooks = [{ id = "uv-lock", priority = 0 }]

# MARK: pre-commit-hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

# MARK: check-merge-conflict
[[repos.hooks]]
id = "check-merge-conflict"
priority = 0

# MARK: check-added-large-files
[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=750"]
exclude = "^uv\\.lock$"
priority = 0

# MARK: check-toml
[[repos.hooks]]
id = "check-toml"
priority = 0

# MARK: check-yaml
[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]
priority = 0

# MARK: end-of-file-fixer
[[repos.hooks]]
id = "end-of-file-fixer"
priority = 0

# MARK: trailing-whitespace
[[repos.hooks]]
id = "trailing-whitespace"
priority = 0

# MARK: betterleaks
# Secret scanner (gitleaks fork). language = "golang" so prek builds it from the
# pinned tag in an isolated toolchain. Scans staged changes on commit; --redact
# keeps any matched secret out of the output.
[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.9.0"
hooks = [{ id = "betterleaks", priority = 0 }]

# MARK: agents-conventional-commits
# CES-75. Merge, revert and fixup subjects are exempt.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "agents-conventional-commits"
name = "agents-conventional-commits (commit-msg)"
entry = "cargo run --quiet --locked -p botica-cli -- lint --select conventional-commits --commit-msg"
language = "system"
stages = ["commit-msg"]

# MARK: no-ai-coauthorship
# CES-91. `--no-verify` skips this hook; `commit-policy.yml` checks the commits again in CI.
[[repos.hooks]]
id = "no-ai-coauthorship"
name = "no-ai-coauthorship (commit-msg)"
entry = "cargo run --quiet --locked -p botica-cli -- lint --select no-ai-coauthorship --commit-msg"
language = "system"
stages = ["commit-msg"]

# MARK: validate-pyproject
[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "0.26"
hooks = [
  { id = "validate-pyproject", files = "^pyproject\\.toml$", priority = 0 }
]

# MARK: ruff-format
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.1"

[[repos.hooks]]
id = "ruff-format"
priority = 0

# MARK: ruff-check
[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--exit-non-zero-on-fix"]
types_or = ["python", "pyi"]
require_serial = true
priority = 1

# MARK: pyrefly
[[repos]]
repo = "local"

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uvx pyrefly check --config pyproject.toml"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: deptry
# CES-109.
[[repos.hooks]]
id = "deptry"
name = "deptry (unused/missing/misplaced dependencies)"
entry = "uvx deptry ."
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: jscpd
# CES-118. `catalog/recipes/files/**` and `catalog/recipes/sections/**` are the templates that this
# repository installs its own configuration from, and the variant of a workflow for each ecosystem
# repeats its header. A rule of botica for TypeScript carries its `typescript.yml` again as
# `tsx.yml` and `javascript.yml`, with only `language:` changed.
# The gate is the duplicated-lines percentage, set just above the baseline of the repository; do not
# add `--exit-code`, which fails on any clone.
[[repos.hooks]]
id = "jscpd"
name = "jscpd (copy-paste duplication)"
entry = "npx --yes jscpd@5 . --threshold 2.5 --ignore \"catalog/recipes/files/**,catalog/recipes/sections/**,catalog/rules/**/tsx.yml,catalog/rules/**/javascript.yml\""
language = "system"
pass_filenames = false
priority = 2

# MARK: skill-validator
# Spec, links, token counts and content checks of the skills under `skills/`, by
# agent-ecosystem/skill-validator. Warnings fail like errors (`--strict`). The flags are in
# `scripts/check_skills.sh`. Needs Go on the PATH.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "skill-validator"
name = "skill-validator"
entry = "sh scripts/check_skills.sh"
language = "system"
files = "^skills/"
pass_filenames = false
priority = 2

# MARK: agnix
# Lints the files that agents read: AGENTS.md, SKILL.md, opencode.jsonc, the Claude settings and the
# like. The mirror passes `--strict`, which fails the hook on a warning; `args = []` removes it, so
# an error fails the hook and a warning does not. `uvx agnix .` lists the warnings.
[[repos]]
repo = "https://github.com/agent-sh/agnix"
rev = "v0.59.0"
hooks = [{ id = "agnix", args = [], priority = 2 }]

# MARK: botica
# Selection and exclusions: `[tool.botica]` of `pyproject.toml`. The hooks of the mirror
# (`distribution/botica-pre-commit/.pre-commit-hooks.yaml`), with the botica of the checkout: a pull
# request that adds a rule selects it before a release knows it (ADR 0013). `botica-release.yml`
# runs the mirror on this repository after each release.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "botica"
name = "botica"
entry = "cargo run --quiet --locked -p botica-cli -- lint --scope file --force-exclude"
language = "system"
types = ["file"]
verbose = true
priority = 2

[[repos.hooks]]
id = "botica-project"
name = "botica (rules of project scope)"
entry = "cargo run --quiet --locked -p botica-cli -- lint --scope project"
language = "system"
pass_filenames = false
always_run = true
verbose = true
priority = 2

# The block of AGENTS.md and the rubric of abide match the catalog and the configuration.
[[repos.hooks]]
id = "botica-agents-md"
name = "botica (block of the judgment rules in AGENTS.md)"
entry = "cargo run --quiet --locked -p botica-cli -- rules export --format agents-md --output AGENTS.md --check"
language = "system"
pass_filenames = false
always_run = true
priority = 2

[[repos.hooks]]
id = "botica-rubric"
name = "botica (rubric of abide)"
entry = "cargo run --quiet --locked -p botica-cli -- rules export --format abide --check"
language = "system"
pass_filenames = false
always_run = true
priority = 2
