[workspace]
resolver = "2"
members = [
    "crates/botica-astgrep",
    "crates/botica-ext",
    "crates/botica-core",
    "crates/botica-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
ast-grep-core = "=0.41.0"
ast-grep-config = "=0.41.0"
ast-grep-language = "=0.41.0"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", default-features = false }
globset = "0.4"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
