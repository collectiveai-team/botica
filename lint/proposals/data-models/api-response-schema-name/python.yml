id: api-response-schema-name
language: python
severity: warning
message: "botica/api-response-schema-name: a response schema is named {Name}Out. Rename the class so that its name ends with `Out`."
files:
  - "**/api/**/schemas/responses/**/*.py"
rule:
  kind: class_definition
  all:
    - has:
        field: superclasses
        stopBy: end
        regex: "BaseModel"
    - not:
        has:
          field: name
          regex: "Out$"
