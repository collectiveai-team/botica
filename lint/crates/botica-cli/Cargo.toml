[package]
name = "botica-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "botica"
path = "src/main.rs"

[features]
# Every grammar ast-grep ships; the default build carries the base set only.
all-languages = ["botica-astgrep/all-languages"]

[dependencies]
anyhow.workspace = true
blake3 = "1"
botica-astgrep = { path = "../botica-astgrep" }
botica-catalog = { path = "../botica-catalog" }
botica-config = { path = "../botica-config" }
botica-core = { path = "../botica-core", features = ["fs"] }
botica-ext = { path = "../botica-ext" }
clap.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
