[package]
name = "botica-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "botica"
path = "src/main.rs"

[features]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys", "dep:tree-sitter"]

[dependencies]
mimalloc = { version = "0.1", optional = true, default-features = false }
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
tree-sitter = { version = "=0.26.13", optional = true }
anyhow.workspace = true
blake3 = "1"
botica-astgrep = { path = "../botica-astgrep" }
botica-core = { path = "../botica-core", features = ["fs"] }
botica-ext = { path = "../botica-ext" }
clap.workspace = true
