id: log-no-print
language: typescript
severity: warning
message: "CES-46 (log-no-print): Libraries log, they don't print — use the project logger instead of console.log() in library code."
ignores:
  - "**/*.test.ts"
rule:
  pattern: console.log($$$ARGS)
  not:
    inside:
      stopBy: end
      kind: catch_clause
