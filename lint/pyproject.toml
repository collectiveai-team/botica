[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# Binary-only wheels of `botica lint`, built from the Rust workspace in this directory. This is
# not the `scaffolding` package (its pyproject.toml is at the root of the repo, and that package
# keeps its name). The version comes from `[workspace.package]` in Cargo.toml.
[project]
name = "botica"
description = "Deterministic linter for the house engineering standards"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/botica-cli/Cargo.toml"
strip = true
