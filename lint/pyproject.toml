[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# Binary-only wheels of `botica lint`, built from the Rust workspace in this directory. The
# pyproject.toml at the root of the repo holds the maintainer scripts. The version comes from
# `[workspace.package]` in Cargo.toml.
[project]
name = "botica"
description = "Deterministic linter for the house engineering standards"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

# `botica[sdk]` is what an extension script declares to write its rule with `botica.sdk` and to
# parse with ast-grep.
[project.optional-dependencies]
sdk = ["ast-grep-py"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/botica-cli/Cargo.toml"
python-source = "python"
strip = true
