description = "Any repository: the rules about any file, the skills, .gitignore, the prek hooks and the sections of AGENTS.md"
rules = ["file-size-guard", "no-notebooks", "no-artifacts-in-package"]

[[skills]]
source = "mattpocock/skills#v1.2.3"
names = [
  "grill-with-docs",
  "triage",
  "improve-codebase-architecture",
  "setup-matt-pocock-skills",
  "to-spec",
  "to-tickets",
  "implement",
  "wayfinder",
  "prototype",
  "diagnosing-bugs",
  "research",
  "tdd",
  "domain-modeling",
  "codebase-design",
  "code-review",
  "resolving-merge-conflicts",
  "wizard",
  "grill-me",
  "teach",
  "writing-for-agents",
  "grilling",
  "wait-what",
]

[[skills]]
source = "collectiveai-team/botica"
names = [
  "ask-user",
  "journalist",
  "handoff",
  "test-smell-review",
  "engineering-rules",
  "engineering-pr-review",
  "engineering-refactor",
]

[[gitignore]]
lines = [
  ".env",
  "!.env.schema",
  ".tmp/",
  ".scratch/",
  ".worktrees/",
  ".journals/",
  ".agents/skills/",
]
unignore = ["skills-lock.json"]

[[files]]
path = "prek.toml"
template = "files/prek-base.toml"

[[sections]]
path = "AGENTS.md"
marker = "## Repo Workspace Defaults"
template = "sections/agents-workspace-defaults.md"

[[sections]]
path = "AGENTS.md"
marker = "## Engineering Standards"
template = "sections/standards-index.md"
