description = "A Python project: the rules of any repository and the ones about Python code"
extends = ["generic"]
rules = [
  "no-utils",
  "no-tests-in-package",
  "no-dict-alias",
  "no-dict-call-return",
  "no-dict-literal-return",
  "no-dict-return-annotation",
  "api-schemas-extra-forbid",
  "log-get-logger",
  "log-no-print",
  "settings-module",
  "cli-typed-framework",
  "arch-database-package",
]
