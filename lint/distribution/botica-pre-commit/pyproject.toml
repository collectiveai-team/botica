[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Nothing to import: prek installs this package into the hook environment only to pull in the
# `botica` wheel of the exact same version. Keep the two versions equal.
[project]
name = "botica-pre-commit"
version = "0.7.1"
description = "Mirror of botica for prek and pre-commit"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["botica==0.7.1"]

[tool.setuptools]
packages = []
