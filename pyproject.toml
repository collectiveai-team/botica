[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# Wheels of `botica` with the binary and the module `botica.sdk`, built from the Rust workspace of
# this repository. The version comes from `[workspace.package]` in Cargo.toml.
[project]
name = "botica"
description = "Deterministic linter: the rules of its catalog and of a project"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lionel Chamorro" }, { name = "Raúl Barriga Rubio" }]
keywords = ["linter", "standards", "pre-commit", "recipes", "ai-agents"]
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://collectiveai-team.github.io/botica/"
Documentation = "https://collectiveai-team.github.io/botica/"
Repository = "https://github.com/collectiveai-team/botica"
Issues = "https://github.com/collectiveai-team/botica/issues"
Changelog = "https://github.com/collectiveai-team/botica/releases"

# `botica[sdk]` is what an extension script declares to write its rule with `botica.sdk` and to
# parse with ast-grep.
[project.optional-dependencies]
sdk = ["ast-grep-py"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/botica-cli/Cargo.toml"
python-source = "sdk/python"
strip = true

# The maintainer scripts under `scripts/` and their tests. They are not part of the wheel: their
# dependencies are the `dev` group, which needs Python 3.11.
[dependency-groups]
dev = [
  "cyclopts>=5.2.0",
  "pytest>=9.0",
  # CES-111
  "pytest-randomly>=4.1.0",
  "pytest-socket>=0.8.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.17.0",
]
# The code of the built-in topics, under `catalog/references/<topic>/code/`, and its tests. The
# versions are fixed: they are the ones the code is written and tested against, and
# `scripts/check_references.sh` runs with this group.
references = [
  "alembic==1.20.0",
  "blockbuster==1.5.29",
  "fastapi==0.153.0",
  "httpx==0.28.1",
  "hypothesis==6.170.5",
  "prefect==3.8.8",
  "pydantic==2.14.1",
  "pydantic-ai-slim==2.58.0",
  "pydantic-settings==2.16.1",
  "pyjwt[crypto]==2.15.1",
  "pyrefly==1.4.0",
  # CES-64: `scripts/check_references.sh` runs the tests of the topics with the network blocked.
  "pytest-socket==0.8.1",
  "sqlmodel==0.0.48",
  "structlog==26.1.0",
]

# `uv sync` and `uv run` install the `dev` group and leave the Rust package unbuilt; `maturin`
# builds the wheel.
[tool.uv]
package = false
# CES-128: uv resolves only what was uploaded 7 days ago or earlier.
exclude-newer = "7 days"
# The group `references` pins these releases, uploaded less than 7 days before 2026-10-22, and
# certifi 2026.10.19 fixes PYSEC-2026-4320. Remove on 2026-10-29.
exclude-newer-package = { certifi = "2026-10-22T00:00:00Z", fastapi = "2026-10-22T00:00:00Z", hypothesis = "2026-10-22T00:00:00Z", pydantic-ai-slim = "2026-10-22T00:00:00Z", pydantic-graph = "2026-10-22T00:00:00Z", pydantic-settings = "2026-10-22T00:00:00Z" }

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }
# Not 3.15: pyyaml 6.0.3 and ruamel-yaml-clib 0.2.15 (through prefect) publish no cp315 wheels.
references = { requires-python = ">=3.14" }

[tool.ruff]
line-length = 100
# The scripts need 3.11 (the `dev` group); `requires-python` is the floor of the wheel.
target-version = "py311"
# Vendored skill scripts are independent artifacts; lint only the maintainer code.
# The botica lint rule fixtures are deliberately bad code (and carry `# noqa: BT…` codes ruff
# would otherwise strip), so ruff leaves them alone. The fixtures of botica-complexity are copied
# from complexipy as they are.
extend-exclude = [
  "skills",
  "catalog/rules/**/fixtures",
  "crates/botica-complexity/tests/fixtures",
]
force-exclude = true
# `botica.sdk` ships in the wheel, whose floor is Python 3.9; the topics run on the Python of the
# group `references`.
per-file-target-version = { "sdk/python/**" = "py39", "catalog/references/**" = "py314" }

[tool.ruff.lint]
# The codes of botica in `# noqa` comments.
external = ["BT"]
# DOC102, DOC202 and DOC403 are preview rules. `explicit-preview-rules` keeps every other preview
# rule off, and `preview` stays in `lint` so that the formatter keeps its stable style.
preview = true
explicit-preview-rules = true
select = [
  "E",
  "F",
  "I",
  "C4",
  "C90",
  "ICN",
  "INP",
  "PIE",
  "PT",
  "TC",
  "PGH",
  "NPY",
  "PLE",
  "PLW",
  "FA",
  "B",
  "S",
  "G",
  "SIM",
  "RET",
  "DTZ",
  "PTH",
  "LOG",
  "TID",
  "UP",
  "RUF",
  "ERA001",
  "ASYNC",
  "A",
  "BLE",
  "SLOT",
  "PLR0124",
  "PLR0133",
  "D200",
  "D205",
  "D212",
  "D300",
  "D301",
  "D400",
  "D401",
  "D403",
  "D405",
  "D406",
  "D407",
  "D408",
  "D409",
  "D410",
  "D411",
  "D412",
  "D413",
  "D414",
  "D415",
  "D417",
  "D418",
  "D419",
  "DOC102",
  "DOC202",
  "DOC403",
  "PERF",
]

# The maintainer scripts shell out to known tools (git, uv, npx, gh) by name, so
# the subprocess-audit rules that flag that pattern are disabled.
ignore = ["S603", "S607"]
task-tags = ["TODO", "FIXME", "XXX", "MARK"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

# `app` is the package of the code of the topics (catalog/references/<topic>/code/app).
[tool.ruff.lint.isort]
known-first-party = ["app"]

# FastAPI reads the annotations of an endpoint when the route is declared, and pydantic those of a
# model when the class is built (a table of SQLModel is a pydantic model), so their imports stay
# out of a `TYPE_CHECKING` block.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
  "sqlmodel.SQLModel",
]
runtime-evaluated-decorators = [
  "fastapi.APIRouter.get",
  "fastapi.APIRouter.post",
  "fastapi.APIRouter.put",
  "fastapi.APIRouter.patch",
  "fastapi.APIRouter.delete",
  "fastapi.FastAPI.get",
  "fastapi.FastAPI.post",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]
# Maintainer scripts run as files, not as an importable package.
"scripts/**" = ["INP001"]
# botica's Python extension SDK and benchmark scripts run as files, not as a package.
"sdk/**" = ["INP001"]
"bench/**" = ["INP001"]
# The code of a topic is the namespace package `app` (scripts/check_references.sh).
"catalog/references/**" = ["INP001"]
"catalog/references/*/tests/**" = ["S101"]
"catalog/references/*/code/tests/**" = ["S101"]

[tool.botica]
# The rules of the recipes `base` and `base-python`.
select = [
  "file-size-guard",
  "no-notebooks",
  "no-artifacts-in-package",
  "io-error",
  "unused-suppression",
  "invalid-suppression",
  "external-config",
  "conventional-commits",
  "no-ai-coauthorship",
  "no-utils",
  "no-tests-in-package",
  "no-dict-alias",
  "no-dict-call-return",
  "no-dict-literal-return",
  "no-dict-return-annotation",
  "api-schemas-extra-forbid",
  "log-get-logger",
  "log-no-print",
  "settings-module",
  "cli-typed-framework",
  "database-package",
  "import-layers",
  "settings-env-schema",
  "cognitive-complexity",
  "ruff-selection",
  "uv-cooldown",
  "pytest-strict",
  "test-no-subprocess",
  "test-no-network",
  "asyncio-no-get-event-loop",
  "docstring-matches-signature",
  "no-tautological-assert",
  "pyrefly-strict",
  "no-type-cast",
  "dependabot-cooldown",
  "cargo-cooldown",
  "separate-orchestration",
  "architecture-vocabulary",
  "pr-small-by-intent",
  "respect-local-repo",
  "test-in-memory-adapters",
  "test-through-interface",
  "test-coverage-gap",
  "coverage-exclusion-reachable",
  "plain-writing",
  "minimal-comments",
  "ubiquitous-language",
  "agents-md-refs-exist",
  "botica-version-aligned",
]
preview = true
# The fixtures of the rules are wrong on purpose, those of botica-complexity are copied from
# complexipy, and the skills are authored skills, checked by skill-validator (ruff leaves them out
# for the same reasons).
extend-exclude = [
  "catalog/rules/**/fixtures/",
  "crates/botica-complexity/tests/fixtures/",
  "skills/",
]

# The maintainer scripts and the benchmarks are command-line programs run as files: their output
# is what they print.
[tool.botica.rules.log-no-print]
extend-ignores = ["scripts/**", "bench/**"]

# The settings of the code of a topic belong to the project that copies it, and its `.env.schema`
# declares their variables.
[tool.botica.rules.settings-env-schema]
extend-ignores = ["catalog/references/**"]

# The benchmarks run with a bare `python` and the standard library only, so they parse their
# arguments with `sys.argv`.
[tool.botica.rules.cli-typed-framework]
extend-ignores = ["bench/**"]

# The table of the rules of ruff is data that `include_str!` embeds in the binary of botica.
[tool.botica.rules.no-artifacts-in-package]
extend-ignores = ["crates/botica-core/src/external_config/ruff_rules.tsv"]

[tool.botica.rules.file-size-guard]
# history.toml is written by scripts/stamp_release.py and grows by one event per change of a rule.
extend-ignores = ["crates/botica-core/src/external_config/ruff_rules.tsv", "catalog/rules/history.toml"]

[tool.pyrefly]
python-version = "3.11"
# CES-58: every value has a type the checker knows.
preset = "strict"
search-path = [".", "tests"]  # the tests import the support module of the site tests
project-excludes = [
  "**/node_modules",
  "**/__pycache__",
  "**/.venv/**/*",
  "**/.worktrees/**/*",
  "**/.tmp/**/*",    # local scratch (spike corpora, benchmarks); gitignored
  "**/.botica/**/*",  # the fixtures that `botica rules test --judge` and `rules conform` lay out
  "skills/**/*",
  # The Rust workspace and what its build reads; the Python SDK needs `botica[sdk]`, outside
  # the `dev` group, and the benchmarks run with a bare `python`.
  "crates/**/*",
  "target/**/*",
  "catalog/**/*",
  "distribution/**/*",
  "sdk/**/*",
  "bench/**/*",
]
use-ignore-files = false
disable-project-excludes-heuristics = true

[tool.pyrefly.errors]
explicit-any = true
missing-attribute-patch-target = "error"
unused-coroutine = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
# CES-125 and CES-64: pytest fails a run on an unknown marker or setting, a passing xfail or an
# empty parametrize, and the tests reach no network.
strict_config = true
strict_markers = true
strict_xfail = true
strict_parametrization_ids = true
empty_parameter_set_mark = "fail_at_collect"
addopts = ["--disable-socket", "--allow-unix-socket"]
required_plugins = ["pytest-socket", "pytest-timeout"]
# The markers of the tests of the topics: `integration` and `e2e` get the network (CES-64).
markers = [
  "integration: tests requiring external services or multi-component interaction",
  "e2e: end-to-end smoke tests",
]

# CES-109. The Rust workspace, what its build reads, its SDKs and its benchmarks are outside the
# import graph of the scripts, and `skills` holds authored skills, checked by skill-validator.
[tool.deptry]
extend_exclude = [
  "crates", "target", "catalog", "distribution", "sdk", "bench", "skills",
]

# `[project]` is the wheel of botica. `ast-grep-py` is its `sdk` extra, which the extension scripts
# of a project import; the maintainer scripts import `cyclopts` from the `dev` group.
[tool.deptry.per_rule_ignores]
DEP002 = ["ast-grep-py"]
DEP004 = ["cyclopts"]
