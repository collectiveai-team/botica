# The maintainer scripts under `scripts/` and their tests; botica itself is the Rust workspace in
# `lint/`, with a `pyproject.toml` of its own.
[project]
name = "botica-maintainer"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "cyclopts>=4.22.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  # CES-111 (test-order-randomization-pytest-randomly): random, reproducibly-seeded test
  # order on every run — catches state-leaking/order-dependent tests for free.
  "pytest-randomly>=4.1.0",
  "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
# Vendored skill scripts are independent artifacts; lint only the maintainer code.
# The botica lint rule fixtures are deliberately bad code (and carry `# noqa: BT…` codes ruff
# would otherwise strip), so ruff leaves them alone.
extend-exclude = [
  "skills",
  "lint/rules/**/fixtures",
]
force-exclude = true
# `botica.sdk` ships in the wheel of `lint/pyproject.toml`, whose floor is Python 3.9.
per-file-target-version = { "lint/sdk/python/**" = "py39" }

[tool.ruff.lint]
# The codes of botica in `# noqa` comments.
external = ["BT"]
select = [
  "E",
  "F",
  "I",
  "C4",
  "C90",
  "ICN",
  "INP",
  "PIE",
  "PT",
  "TC",
  "PGH",
  "NPY",
  "PLE",
  "PLW",
  "FA",
  "B",
  "S",
  "G",
  "SIM",
  "RET",
  "DTZ",
  "PTH",
  "LOG",
  "TID",
  "UP",
  "RUF",
  "ERA001",
  "D200",
  "D205",
  "D212",
  "D300",
  "D301",
  "D400",
  "D401",
  "D403",
  "D405",
  "D406",
  "D407",
  "D408",
  "D409",
  "D410",
  "D411",
  "D412",
  "D413",
  "D414",
  "D415",
  "D417",
  "D418",
  "D419",
  "PERF",
]

# The maintainer scripts shell out to known tools (git, uv, npx, gh) by name, so
# the subprocess-audit rules that flag that pattern are disabled. The rest of the
# security ruleset stays on.
ignore = ["S603", "S607"]
task-tags = ["TODO", "FIXME", "XXX", "MARK"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

# Ban relative imports (e.g. `from .x import ...`); imports are absolute.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]
# Maintainer scripts run as files, not as an importable package.
"scripts/**" = ["INP001"]
# botica lint's Python extension SDK and benchmark scripts run as files, not as a package.
"lint/**" = ["INP001"]

[tool.botica]
# The fixtures of the rules are wrong on purpose, and the skills are vendored payload (ruff leaves
# them out for the same reason).
extend-exclude = ["lint/rules/**/fixtures/", "lint/proposals/**/fixtures/", "skills/"]

# The maintainer scripts and the benchmarks are command-line programs run as files: their output
# is what they print.
[tool.botica.rules.log-no-print]
extend-ignores = ["scripts/**", "lint/bench/**"]

# The benchmarks run with a bare `python` and the standard library only, so they parse their
# arguments with `sys.argv`.
[tool.botica.rules.cli-typed-framework]
extend-ignores = ["lint/bench/**"]

[tool.pyrefly]
search-path = [".", "tests"]  # the tests import the support module of the site tests
project-excludes = [
  "**/node_modules",
  "**/__pycache__",
  "**/.venv/**/*",
  "**/.worktrees/**/*",
  "**/.tmp/**/*",    # local scratch (spike corpora, benchmarks); gitignored
  "skills/**/*",
  "lint/**/*",       # Rust workspace; its Python SDK and bench scripts have their own deps
]
use-ignore-files = false
disable-project-excludes-heuristics = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# CES-109 (dep-hygiene-deptry): declared deps must match the actual import graph. `lint` is the
# Rust workspace and `skills` is vendored payload, outside the import graph of the scripts.
[tool.deptry]
extend_exclude = ["lint", "skills"]
