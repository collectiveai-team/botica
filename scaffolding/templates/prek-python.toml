# MARK: validate-pyproject
[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "v0.25"
hooks = [
  { id = "validate-pyproject", files = "^pyproject\\.toml$", priority = 0 }
]

# MARK: ruff-format
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.22"

[[repos.hooks]]
id = "ruff-format"
priority = 0

# MARK: ruff-check
[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--exit-non-zero-on-fix"]
types_or = ["python", "pyi"]
require_serial = true
priority = 1

# MARK: pyrefly
[[repos]]
repo = "local"

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uvx pyrefly check --config pyproject.toml"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: ast-grep
[[repos.hooks]]
id = "ast-grep"
name = "ast-grep"
entry = "uvx --from ast-grep-cli ast-grep scan"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: deptry
# CES-109: declared `pyproject.toml` dependencies must match the actual import graph — no
# declared-but-unused deps, no imported-but-undeclared deps, no dev-vs-prod misplacement. Add
# a `[tool.deptry]` config with `extend_exclude` if the repo has separate-distribution
# subpackages or bundled/vendored payload (see this tool's own pyproject.toml for an example).
[[repos.hooks]]
id = "deptry"
name = "deptry (unused/missing/misplaced dependencies)"
entry = "uvx deptry ."
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: complexipy
# CES-110: cognitive-complexity ceiling per function — complements (not replaces) ruff's
# cyclomatic `C90`/mccabe check by penalizing nesting depth and control-flow breaks, the metric
# that tracks how hard a human actually finds a function to read.
[[repos.hooks]]
id = "complexipy"
name = "complexipy (cognitive complexity)"
entry = "uvx complexipy --max-complexity-allowed 15"
language = "system"
types = ["python"]
priority = 2

# MARK: botica
# The structure rules, run by `botica lint` (it must be on PATH): CES-71 file-size-guard (400 warn
# / 700 error), CES-63 no-utils, and the layout rules that replace the old `repo-shape` hook
# (CES-32 no-notebooks and no-artifacts-in-package, plus no-tests-in-package). The ast-grep rules
# keep their own hook, so botica skips them here. Findings carry their own CES code.
[[repos.hooks]]
id = "botica"
name = "botica (file size, catch-all modules, package layout)"
entry = "botica lint --no-astgrep --select file-size-guard,no-utils,no-notebooks,no-artifacts-in-package,no-tests-in-package"
language = "system"
priority = 2
