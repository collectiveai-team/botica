name: Release

# Tag-driven (hatch-vcs): `git tag vX.Y.Z && git push origin vX.Y.Z`.
# Gated on the Tests suite (reusable workflow) — the release only runs after
# lint, type-check and pytest pass for the tagged commit.
# Builds the sdist/wheel and creates a GitHub Release, then starts pypi.yml
# with workflow_dispatch. PyPI publishing is a separate workflow, so a PyPI
# misconfiguration never blocks the GitHub Release and Trusted Publishing stays
# pinned to pypi.yml as its own top-level workflow.

on:
  push:
    tags:
      - "v*.*.*"

# No top-level permissions: grant least privilege per job instead.
jobs:
  # Run the full Tests suite against the tagged commit first; release depends
  # on it via `needs`, so a failing build never produces a Release.
  test:
    name: tests
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  release:
    name: build & github release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # start pypi.yml at the end of this job
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs needs the full history + tags to derive the version.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        # Pinned to an exact immutable tag, not a major tag: setup-uv stopped
        # publishing @v8 / @v8.x from v8.0.0 on, as supply-chain hardening.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.3"
          # Cache disabled in the release job: it runs with contents: write on
          # tag push, so a poisoned cache could taint a privileged build.
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

      # The Release above is created with GITHUB_TOKEN, and GitHub does not start
      # a workflow from an event that GITHUB_TOKEN emits, so `release: published`
      # never reaches pypi.yml. workflow_dispatch is the documented exception.
      - name: Dispatch PyPI publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run pypi.yml --repo "$GITHUB_REPOSITORY" -f ref="$REF_NAME"
